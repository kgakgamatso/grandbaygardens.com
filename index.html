<style>
:root{
  --cream:#f6f1e6;--paper:#fffdf8;--sand:#ebe2cf;--sand-2:#ddd0b5;
  --forest:#1f3d2b;--forest-2:#2d5940;--moss:#6f8f5f;--sage:#dfe7d6;
  --brass:#a8834b;--brass-2:#c9a96e;--ink:#1c2420;--muted:#5d6a61;--faint:#8a958c;
  --line:rgba(31,61,43,.14);--line-2:rgba(31,61,43,.26);
  --rose:#b5483d;--amber:#b7791f;--sky:#2f6f8f;--wa:#1faa59;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--script:'Great Vibes',cursive;--sans:'Libre Franklin',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:2px;--r-sm:2px;--max:1240px;--gut:clamp(16px,4vw,40px);
  --shadow:0 40px 70px -50px rgba(20,35,26,.55);--shadow-sm:none;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:90px}
body{margin:0;background:var(--cream);color:var(--ink);font:400 16.5px/1.7 var(--sans);overflow-x:hidden}
img,video{max-width:100%;display:block}
a{color:var(--forest-2)}
a:hover{color:var(--brass)}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;line-height:1.08;margin:0 0 .45em;color:var(--forest);letter-spacing:-.005em}
h1{font-size:clamp(2.6rem,6.2vw,5rem)}
h2{font-size:clamp(2rem,4vw,3.2rem)}
h3{font-size:1.55rem}
p{margin:0 0 1em}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px;border-radius:4px}
::selection{background:var(--sand-2)}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--forest);color:#fff;padding:10px 16px;border-radius:8px}
.skip:focus{top:12px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.1em;height:1.1em;flex:none;vertical-align:-.18em}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.end{justify-content:flex-end}.row.between{justify-content:space-between}.row.center{justify-content:center}
.stack>*+*{margin-top:16px}
.script{font-family:var(--script);font-weight:400;color:var(--brass);letter-spacing:0;line-height:1}
.kicker{display:block;font:italic 500 1.25rem/1.2 var(--serif);color:var(--brass);margin-bottom:10px}
.lead{font-size:clamp(1.05rem,1.5vw,1.2rem);color:var(--muted);max-width:640px}

/* Buttons */
.btn{--bh:50px;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:var(--bh);padding:0 26px;border-radius:1px;border:1px solid var(--forest);cursor:pointer;
  font:500 .95rem/1 var(--sans);letter-spacing:.01em;color:#fff;background:var(--forest);text-decoration:none!important;white-space:nowrap;transition:background .2s,color .2s,border-color .2s,transform .2s}
.btn:hover{background:var(--forest-2);color:#fff;transform:translateY(-1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.gold{background:var(--brass);border-color:var(--brass)}.btn.gold:hover{background:#8f6e3c}
.btn.ghost{background:transparent;color:var(--forest);border-color:var(--line-2)}.btn.ghost:hover{border-color:var(--forest);background:rgba(31,61,43,.05);color:var(--forest)}
.btn.light{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.7);backdrop-filter:blur(4px)}.btn.light:hover{background:#fff;color:var(--forest)}
.btn.wa{background:var(--wa);border-color:var(--wa)}.btn.wa:hover{background:#178a48}
.btn.danger{background:var(--rose);border-color:var(--rose)}
.btn.sm{--bh:40px;padding:0 18px;font-size:.88rem}
.btn.xs{--bh:32px;padding:0 12px;font-size:.82rem}
.link{font:italic 500 1.2rem/1 var(--serif);color:var(--forest);text-decoration:none;display:inline-flex;align-items:center;gap:8px;border-bottom:1px solid var(--brass);padding-bottom:6px}
.link:hover{color:var(--brass)}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:1px;border:1px solid var(--line-2);background:var(--paper);color:var(--forest);cursor:pointer}
.icon-btn:hover{border-color:var(--forest)}

/* Header */
.announce{background:var(--forest);color:#f3e7cc;text-align:center;font-size:.85rem;letter-spacing:.04em;padding:8px var(--gut)}
.site-header{position:sticky;top:0;z-index:40;background:rgba(246,241,230,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transition:background .3s,border-color .3s,color .3s;color:var(--forest)}
body.has-hero:not(.scrolled) .site-header{position:fixed;left:0;right:0;background:linear-gradient(rgba(10,22,15,.55),transparent);border-color:transparent;color:#fff;backdrop-filter:none}
body.has-hero:not(.scrolled) .announce+.site-header{top:auto}
.nav{display:flex;align-items:center;gap:20px;min-height:84px}
.logo{display:flex;align-items:center;color:inherit;text-decoration:none!important;margin-right:auto}
.logo svg{height:58px;width:auto}
.logo img{height:56px;width:auto}
.nav-links{display:flex;gap:2px;list-style:none;margin:0;padding:0}
.nav-links a{display:block;padding:10px 13px;color:inherit;text-decoration:none;font:400 .98rem/1 var(--sans);opacity:.9;border-bottom:1px solid transparent}
.nav-links a:hover{opacity:1;border-color:currentColor}
.nav-links a[aria-current=page]{opacity:1;border-color:var(--brass)}
.menu-btn{display:none;background:transparent;color:inherit;border-color:currentColor}
@media (max-width:1100px){
  .menu-btn{display:inline-grid}
  .nav-links{position:fixed;inset:0 0 0 auto;width:min(86vw,360px);flex-direction:column;gap:0;padding:96px 28px 28px;background:var(--forest);color:#f6f1e6;transform:translateX(100%);transition:transform .3s;z-index:-1;box-shadow:-20px 0 60px rgba(0,0,0,.25)}
  .nav-links.open{transform:none}
  .nav-links a{padding:16px 4px;font-size:.9rem;border-bottom:1px solid rgba(255,255,255,.12)!important;color:#f6f1e6}
  .nav .hide-m{display:none}
  .m-only{display:block!important}
}
.m-only{display:none}
@media (max-width:600px){.nav{gap:10px;min-height:72px}.logo svg{height:46px}.nav>.btn.gold{display:none}}

/* Hero */
.hero{position:relative;min-height:min(100vh,920px);display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:var(--forest)}
.hero .slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.6s ease;transform:scale(1.06)}
.hero .slide.on{opacity:1;animation:kb 9s ease-out forwards}
@keyframes kb{from{transform:scale(1.06)}to{transform:scale(1.0)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,22,15,.62) 0%,rgba(10,22,15,.25) 55%,rgba(10,22,15,.05) 100%),linear-gradient(180deg,rgba(10,22,15,.4) 0%,transparent 30%,rgba(10,22,15,.55) 100%)}
.hero-inner{position:relative;z-index:1;width:100%;padding-top:150px;padding-bottom:150px}
.hero .kicker{color:#ecd9b0}
.hero h1{color:#fff;max-width:880px;text-shadow:0 2px 30px rgba(0,0,0,.25)}
.hero .script{font-size:clamp(2rem,4vw,3rem);color:#ecd9b0;display:block;margin:14px 0 6px}
.hero .lead{color:rgba(255,255,255,.9);max-width:620px}
.hero .row{margin-top:30px}
.dots{position:absolute;right:var(--gut);bottom:150px;z-index:2;display:flex;gap:8px}
.dots button{width:28px;height:3px;border:0;padding:0;background:rgba(255,255,255,.45);cursor:pointer}
.dots button[aria-current=true]{background:#fff}

/* Booking bar */
.bookbar{position:relative;z-index:3;margin-top:-84px}
.bookbar form{display:grid;grid-template-columns:1.6fr 1fr .8fr auto;gap:0;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;border:1px solid var(--line)}
.bookbar .field{margin:0;padding:16px 22px;border-right:1px solid var(--line)}
.bookbar label{font:italic 500 1.05rem/1 var(--serif);color:var(--brass)}
.bookbar input,.bookbar select{border:0;padding:6px 0 0;min-height:36px;background:transparent;font-size:1.02rem;box-shadow:none!important}
.bookbar .btn{border-radius:0;height:100%;min-height:84px;padding:0 34px}
@media (max-width:860px){.bookbar{margin-top:-60px}.bookbar form{grid-template-columns:1fr 1fr}.bookbar .field:nth-child(2){border-right:0}.bookbar .field{border-bottom:1px solid var(--line)}.bookbar .btn{grid-column:1/-1;min-height:58px}}
@media (max-width:500px){.bookbar form{grid-template-columns:1fr}.bookbar .field{border-right:0}}

/* Sections */
section{padding:clamp(64px,9vw,120px) 0}
.sec-head{max-width:820px;margin-bottom:46px;padding-top:22px;border-top:1px solid var(--line-2)}
.sec-head.center{margin-inline:auto;text-align:center}
.sec-head.center .lead{margin-inline:auto}
.page-head{padding:clamp(56px,8vw,96px) 0 28px;background:linear-gradient(var(--sand),var(--cream))}
.page-head .lead{margin-bottom:0}
.crumbs{display:flex;gap:8px;color:var(--faint);font-size:.85rem;margin-bottom:18px;flex-wrap:wrap}
.crumbs a{color:var(--muted)}
.alt{background:var(--paper)}
.band{background:var(--forest);color:#efe6d2}
.band h2,.band h3{color:#fff}
.band .lead,.band .muted{color:rgba(239,230,210,.82)}
.band .kicker{color:var(--brass-2)}

/* Intro split */
.split{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,6vw,90px);align-items:center}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.collage{position:relative;min-height:520px}
.collage img{position:absolute;object-fit:cover}
.collage img:first-child{inset:0 22% 18% 0;width:78%;height:82%}
.collage img:last-child{right:0;bottom:0;width:52%;height:58%;border:8px solid var(--cream)}
@media (max-width:600px){.collage{min-height:380px}}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:22px 30px;margin-top:34px;border-top:1px solid var(--line);padding-top:28px}
.stat b{display:block;font:600 2.3rem/1 var(--serif);color:var(--forest);margin-bottom:6px}
.stat span{color:var(--muted);font-size:.92rem}

/* Experience cards */
.exp-grid{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:300px;gap:18px}
.exp-grid .exp:first-child{grid-column:span 2;grid-row:span 2}
@media (max-width:900px){.exp-grid{grid-template-columns:1fr 1fr}.exp-grid .exp:first-child{grid-column:span 2;grid-row:span 1}}
@media (max-width:560px){.exp-grid{grid-template-columns:1fr;grid-auto-rows:340px}.exp-grid .exp:first-child{grid-column:auto}}
.exp{position:relative;overflow:hidden;color:#fff;text-decoration:none!important;display:block;background:var(--forest)}
.exp img,.exp .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s ease}
.exp:hover img{transform:scale(1.06)}
.exp::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(10,22,15,.82))}
.exp .cap{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:24px 26px}
.exp .cap small{display:block;font:italic 500 1.1rem/1 var(--serif);color:#ecd9b0;margin-bottom:8px}
.exp .cap h3{color:#fff;margin:0 0 6px;font-size:1.7rem}
.exp:first-child .cap h3{font-size:clamp(1.9rem,3vw,2.6rem)}
.exp .cap p{margin:0;color:rgba(255,255,255,.85);font-size:.95rem}
.exp .cap .price{color:#ecd9b0;font-family:var(--serif);font-size:1.15rem;margin-top:8px;display:block}
.art{display:grid;place-items:center;background:radial-gradient(circle at 30% 20%,#3d6b4f,#1f3d2b 70%)}
.art .ic{width:30%;max-width:84px;height:auto;color:rgba(236,217,176,.85);stroke-width:1.1}

/* Generic cards */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card.pad{padding:clamp(22px,3vw,36px)}
.grid{display:grid;gap:clamp(16px,2vw,26px)}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.svc{overflow:hidden;display:flex;flex-direction:column;transition:transform .3s,box-shadow .3s}
.svc:hover h3 a{color:var(--brass)}
.svc-media{aspect-ratio:4/3;overflow:hidden;display:block;position:relative}
.svc-media img,.svc-media .art{width:100%;height:100%;object-fit:cover;transition:transform .9s}
.svc:hover .svc-media img{transform:scale(1.05)}
.svc-body{padding:22px 24px 24px;display:flex;flex-direction:column;flex:1}
.svc-body h3 a{color:var(--forest);text-decoration:none}
.svc-body p{color:var(--muted);font-size:.96rem;flex:1}
.price{font-family:var(--serif);font-weight:600;font-size:1.25rem;color:var(--brass)}
.meta{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 0 16px}

/* Pills */
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:1px;font:500 .8rem/1.5 var(--sans);border:1px solid var(--line-2);color:var(--muted);background:var(--paper);white-space:nowrap}
.pill.confirmed,.pill.instant,.pill.closed,.pill.done,.pill.ok{color:#22603d;border-color:#9cc3a8;background:#eef6f0}
.pill.pending,.pill.request,.pill.new,.pill.open,.pill.warn{color:#8a5a12;border-color:#e2c48d;background:#fbf3e3}
.pill.quote,.pill.completed,.pill.in_progress,.pill.info{color:#285e78;border-color:#a9cbdb;background:#eef5f9}
.pill.rejected,.pill.cancelled,.pill.declined,.pill.bad{color:#9b3a30;border-color:#e3b0a9;background:#fbefed}

/* Spa band */
.feature{display:grid;grid-template-columns:1.05fr 1fr;gap:clamp(30px,6vw,80px);align-items:center}
.feature .ph{position:relative;aspect-ratio:4/5;overflow:hidden}
.feature .ph img{width:100%;height:100%;object-fit:cover}
.feature .script{font-size:clamp(3rem,7vw,5.2rem);color:var(--brass-2);display:block;margin-bottom:-6px}
.inc{list-style:none;padding:0;margin:22px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px 22px}
.inc li{display:flex;gap:10px;align-items:flex-start}
.inc .ic{color:var(--brass-2);margin-top:4px}
@media (max-width:900px){.feature{grid-template-columns:1fr}.feature .ph{aspect-ratio:4/3}}

/* Ticks */
.ticks{list-style:none;padding:0;margin:0 0 1em;display:grid;gap:10px}
.ticks li{display:flex;gap:10px;align-items:flex-start}
.ticks .ic{color:var(--moss);margin-top:5px}

/* Promotions rail */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(86%,380px);gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin}
.rail>*{scroll-snap-align:start}
.promo{overflow:hidden;display:flex;flex-direction:column}
.promo .pm{aspect-ratio:16/11;overflow:hidden;position:relative}
.promo .pm img,.promo .pm .art{width:100%;height:100%;object-fit:cover}
.promo .badge{position:absolute;left:0;bottom:0;background:var(--paper);color:var(--forest);font:italic 500 1.05rem/1 var(--serif);padding:10px 16px}
.promo .pb{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.promo .pb p{color:var(--muted);flex:1}

/* Banner ad */
.ad-banner{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);overflow:hidden;background:var(--forest);color:#efe6d2}
.ad-banner img{width:100%;height:100%;object-fit:cover;min-height:220px}
.ad-banner .ab{padding:clamp(24px,4vw,44px);display:flex;flex-direction:column;justify-content:center}
.ad-banner h3{color:#fff;font-size:clamp(1.8rem,3vw,2.4rem)}
@media (max-width:700px){.ad-banner{grid-template-columns:1fr}}
.ad-pop .m-body{padding:0}
.ad-pop img{width:100%;max-height:52vh;object-fit:cover}
.ad-pop .ab{padding:24px 26px 26px;text-align:center}
.ad-pop .script{font-size:3.2rem;display:block}

/* Gallery */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px}
.chip-btn{padding:8px 2px;margin-right:18px;border:0;border-bottom:1px solid transparent;background:transparent;color:var(--muted);font:500 .98rem var(--sans);cursor:pointer;text-decoration:none}
.chip-btn:hover{color:var(--forest);border-color:var(--line-2)}
.chip-btn[aria-pressed=true]{color:var(--forest);border-color:var(--brass);border-bottom-width:2px}
.masonry{columns:3 280px;column-gap:16px}
.masonry figure{break-inside:avoid;margin:0 0 16px;overflow:hidden;position:relative;background:var(--sand)}
.masonry button{all:unset;display:block;cursor:zoom-in;width:100%}
.masonry button:focus-visible{outline:2px solid var(--brass)}
.masonry img,.masonry video{width:100%;transition:transform .8s}
.masonry figure:hover img{transform:scale(1.04)}
.masonry figcaption{position:absolute;inset:auto 0 0 0;padding:30px 16px 12px;font-size:.88rem;color:#fff;background:linear-gradient(transparent,rgba(10,22,15,.7));opacity:0;transition:opacity .3s}
.masonry figure:hover figcaption,.masonry button:focus-visible+figcaption{opacity:1}
.strip{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.strip a{aspect-ratio:1;overflow:hidden;display:block}
.strip img{width:100%;height:100%;object-fit:cover;transition:transform .8s}
.strip a:hover img{transform:scale(1.08)}
@media (max-width:700px){.strip{grid-template-columns:repeat(3,1fr)}}
.empty{text-align:center;padding:48px 20px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted);background:var(--paper)}
.empty .ic{width:40px;height:40px;color:var(--brass);margin:0 auto 12px;display:block}

/* Press */
.press{text-align:center;max-width:900px;margin:0 auto}
.press q{display:block;font:italic 500 clamp(1.8rem,3.6vw,2.8rem)/1.25 var(--serif);color:var(--forest);quotes:"\201C" "\201D"}
.press cite{display:block;margin-top:18px;font:500 .95rem/1 var(--sans);color:var(--brass);font-style:normal}

/* FAQ */
.faq details{border-bottom:1px solid var(--line)}
.faq summary{cursor:pointer;padding:22px 0;font:600 1.3rem/1.3 var(--serif);color:var(--forest);list-style:none;display:flex;justify-content:space-between;gap:16px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--brass);font:400 1.6rem/1 var(--sans)}
.faq details[open] summary::after{content:"\2212"}
.faq details>div{padding:0 0 22px;color:var(--muted);max-width:760px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;min-width:0}
.field label,.lbl{font:500 .92rem/1.3 var(--sans);color:var(--forest)}
.req{color:var(--rose);margin-left:3px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:12px 14px;min-height:50px;transition:border-color .2s,box-shadow .2s}
textarea{min-height:120px;resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--forest) 50%),linear-gradient(135deg,var(--forest) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:40px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--forest);box-shadow:0 0 0 4px rgba(31,61,43,.1)}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--forest);flex:none;margin:3px 0 0}
[aria-invalid=true]{border-color:var(--rose)!important}
.err{color:var(--rose);font-size:.9rem}
.err:empty{display:none}
.help{color:var(--faint);font-size:.82rem}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.95rem;color:var(--muted);margin-bottom:12px;cursor:pointer}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 18px}
.form-grid .full{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.pw{position:relative}
.pw input{padding-right:96px}
.pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--forest);font:500 .88rem var(--sans);text-decoration:underline;text-underline-offset:3px;padding:10px;cursor:pointer}
.pw button:hover{background:var(--sand)}
.switch{display:flex;gap:12px;align-items:center;cursor:pointer;margin-bottom:16px;font-weight:500}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:44px;height:26px;border-radius:999px;background:var(--sand-2);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch input:checked+.sw{background:var(--forest)}
.switch input:checked+.sw::after{left:21px}
.switch input:focus-visible+.sw{outline:2px solid var(--brass);outline-offset:3px}

/* Booking */
.book-grid{display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start}
@media (max-width:980px){.book-grid{grid-template-columns:1fr}.sticky{position:static!important}}
.sticky{position:sticky;top:104px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;list-style:none;padding:0;margin:0 0 28px}
.steps li{display:flex;flex-direction:column;gap:10px;font:500 .9rem/1.2 var(--sans);color:var(--faint)}
.steps li::before{content:"";height:3px;background:var(--sand-2)}
.steps li[data-s=done]{color:var(--muted)}.steps li[data-s=done]::before{background:var(--moss)}
.steps li[data-s=now]{color:var(--forest)}.steps li[data-s=now]::before{background:var(--brass)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.opt{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;padding:10px;border-radius:var(--r-sm);border:1px solid var(--line-2);background:var(--paper);cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--forest)}
.opt:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.opt[aria-checked=true]{border-color:var(--forest);background:var(--sage);box-shadow:inset 0 0 0 1px var(--forest)}
.opt .oi{width:58px;height:58px;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--sage);color:var(--forest)}
.opt .oi img{width:100%;height:100%;object-fit:cover}
.opt b{display:block;font:600 1.12rem/1.2 var(--serif);color:var(--forest)}
.opt small{color:var(--muted);display:block;margin-top:2px;font-size:.84rem}
.opt.slot{padding:10px 18px}
.cal{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--paper)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cal-head b{font:600 1.4rem/1 var(--serif);color:var(--forest)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font:600 .68rem var(--sans);letter-spacing:.1em;color:var(--faint);padding:4px 0}
.day{all:unset;box-sizing:border-box;aspect-ratio:1;display:grid;place-items:center;font-weight:500;cursor:pointer;position:relative;min-height:36px;color:var(--ink)}
.day:hover:not([disabled]){background:var(--sage)}
.day:focus-visible{outline:2px solid var(--brass)}
.day[disabled]{color:#c4c9c2;cursor:not-allowed}
.day.full,.day.blocked{text-decoration:line-through;color:#d2a49e}
.day.limited::after{content:"";position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--amber)}
.day.today{box-shadow:inset 0 0 0 1px var(--line-2)}
.day.sel{background:var(--forest);color:#fff}
.day.range{background:var(--sage);border-radius:6px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:10px 14px;margin:0 0 18px;font-size:.95rem}
.summary dt{color:var(--faint)}.summary dd{margin:0;text-align:right;font-weight:500}
.sum-img{aspect-ratio:16/10;overflow:hidden;margin-bottom:16px}
.sum-img img,.sum-img .art{width:100%;height:100%;object-fit:cover}
.ref{font:600 clamp(1.8rem,4vw,2.6rem)/1 var(--serif);letter-spacing:.08em;padding:16px 24px;border:1px dashed var(--brass);display:inline-block;margin:8px 0 18px;color:var(--forest);background:var(--paper)}
.success-ic{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:var(--forest);color:#fff;margin:0 auto 20px}
.success-ic .ic{width:34px;height:34px;stroke-width:2.4}

/* Contact & menu */
.contact-card{display:flex;gap:16px;align-items:flex-start;text-decoration:none;color:inherit}
.contact-card .oi{display:grid;place-items:center;width:30px;color:var(--brass);flex:none;padding-top:4px}
.map{width:100%;aspect-ratio:16/10;border:0;border-radius:var(--r);display:block}
.hours{display:grid;grid-template-columns:1fr auto;gap:8px 18px;margin:0}
.hours dt{color:var(--muted)}.hours dd{margin:0;font-weight:500}
.band .hours dt{color:rgba(239,230,210,.75)}
.menu-sec h3{font-size:1.9rem;border-bottom:1px solid var(--line);padding-bottom:10px;margin-top:10px}
.menu-item{display:flex;gap:16px;padding:16px 0;border-bottom:1px dashed var(--line)}
.menu-item img{width:78px;height:78px;object-fit:cover;flex:none}
.menu-item .mi{flex:1;min-width:0}
.menu-item .mt{display:flex;justify-content:space-between;gap:12px;font:600 1.2rem/1.3 var(--serif);color:var(--forest)}
.menu-item .mt span:last-child{color:var(--brass);white-space:nowrap}
.menu-item p{margin:2px 0 0;color:var(--muted);font-size:.93rem}

/* Footer */
.site-footer{background:var(--forest);color:#d9d0bb;padding:72px 0 120px}
.site-footer .logo{color:#f3e7cc;margin-bottom:16px}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.1fr;gap:36px}
.foot-grid h4{font:italic 500 1.3rem/1 var(--serif);color:var(--brass-2);margin-bottom:16px}
.foot-grid ul{list-style:none;padding:0;margin:0;display:grid;gap:9px}
.foot-grid a{color:#d9d0bb;text-decoration:none}
.foot-grid a:hover{color:#fff}
.socials{display:flex;gap:8px;margin-top:16px}
.socials a{width:40px;height:40px;border:1px solid rgba(255,255,255,.25);display:grid;place-items:center}
.foot-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:48px;padding-top:22px;border-top:1px solid rgba(255,255,255,.14);font-size:.85rem;color:#b9b19d}
.foot-bottom a{color:#b9b19d}
@media (max-width:900px){.foot-grid{grid-template-columns:1fr 1fr}}
@media (max-width:540px){.foot-grid{grid-template-columns:1fr}}

/* WhatsApp FAB */
.fab{position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(18px,env(safe-area-inset-bottom));z-index:45;display:inline-flex;align-items:center;gap:10px;height:56px;padding:0 22px 0 18px;border-radius:2px;background:var(--wa);color:#fff;font:500 .95rem var(--sans);box-shadow:0 12px 30px -10px rgba(31,170,89,.7);text-decoration:none!important}
.fab:hover{color:#fff;transform:translateY(-2px)}
.fab .ic{width:24px;height:24px}
@media (max-width:560px){.fab span{display:none}.fab{width:58px;padding:0;justify-content:center}}

/* Toast & modal */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:200;display:grid;gap:10px;width:min(92vw,440px)}
.toast{padding:14px 18px;background:var(--forest);color:#fff;box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;animation:tin .25s ease-out}
.toast.error{background:var(--rose)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
dialog{border:0;border-radius:var(--r);background:var(--paper);color:var(--ink);padding:0;width:min(94vw,580px);max-height:90vh;box-shadow:0 40px 100px -20px rgba(0,0,0,.45)}
dialog.wide{width:min(96vw,880px)}
dialog::backdrop{background:rgba(15,28,20,.55);backdrop-filter:blur(3px)}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 24px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--paper);z-index:2}
.m-head h2{font-size:1.6rem;margin:0}
.m-body{padding:24px}
dialog.ad-pop .m-head{position:absolute;border:0;background:transparent;right:0;left:auto;padding:12px}
dialog.ad-pop .m-head h2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.lightbox{width:min(96vw,1100px);background:#0f1a14}
.lightbox .m-head{background:#0f1a14;border-color:rgba(255,255,255,.1)}
.lightbox .m-head h2{color:#fff;font-size:1.2rem}
.lightbox .m-body{padding:0;display:grid;place-items:center}
.lightbox img,.lightbox video{max-height:76vh;width:auto;margin:auto}
.lb-cap{padding:12px 18px;color:#cfd6cf}

.reveal{opacity:0;transform:translateY(22px);transition:opacity .9s ease,transform .9s ease}
.reveal.in{opacity:1;transform:none}
.boot{min-height:70vh;display:grid;place-items:center}
.spinner{width:40px;height:40px;border-radius:50%;border:2px solid var(--sand-2);border-top-color:var(--forest);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.skel{border-radius:10px;background:linear-gradient(90deg,var(--sand),#f3ede1,var(--sand));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ===== Admin ===== */
body.is-admin .site-header,body.is-admin .site-footer,body.is-admin .fab,body.is-admin .announce{display:none}
body.is-admin{font-size:15px;background:#f3efe5}
.adm{display:grid;grid-template-columns:256px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--forest);color:#e6dcc5;padding:20px 14px;display:flex;flex-direction:column;gap:2px}
.side .logo{color:#f3e7cc;margin:0 8px 18px}
.side .logo svg{height:50px}
.side h5{font:italic 500 1.05rem/1 var(--serif);color:var(--brass-2);margin:18px 12px 6px}
.side a{display:flex;gap:10px;align-items:center;padding:9px 12px;color:#e6dcc5;font-weight:500;font-size:.93rem;text-decoration:none}
.side a:hover{background:rgba(255,255,255,.07);color:#fff}
.side a[aria-current=page]{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 3px 0 0 var(--brass-2)}
.side .count{margin-left:auto;background:var(--brass-2);color:var(--forest);border-radius:999px;font-size:.7rem;font-weight:700;padding:1px 8px}
.side-foot{margin-top:auto;padding:14px 12px 4px;border-top:1px solid rgba(255,255,255,.14);font-size:.86rem}
.side-foot .btn.ghost{color:#e6dcc5;border-color:rgba(255,255,255,.3)}
.main-adm{padding:28px clamp(16px,3vw,40px) 60px;min-width:0}
.adm-top{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.adm-top h1{font-size:clamp(1.9rem,3vw,2.5rem);margin:0}
@media (max-width:900px){
  .adm{grid-template-columns:1fr}
  .side{position:sticky;top:0;z-index:30;height:auto;flex-direction:row;overflow-x:auto;padding:8px;gap:4px}
  .side .logo,.side h5,.side-foot{display:none}
  .side a{white-space:nowrap;padding:8px 12px}
}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:14px;margin-bottom:24px}
.kpi{padding:16px 18px;border:0;border-left:2px solid var(--kc,var(--moss));background:var(--paper);text-decoration:none;color:inherit}
.kpi:hover{box-shadow:var(--shadow-sm)}
.kpi span{color:var(--muted);font-size:.82rem}
.kpi b{display:block;font:600 2.2rem/1.1 var(--serif);color:var(--forest);margin-top:4px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:16px}
.toolbar .field{margin:0;min-width:150px;flex:1}
.toolbar .field.grow{flex:3;min-width:220px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);background:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:12px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 .84rem/1.2 var(--sans);color:var(--forest);background:#f6f1e6;white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fbf8f1}
td .row{gap:6px;flex-wrap:nowrap}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:.86rem}
.thumb{width:76px;height:54px;object-fit:cover;border-radius:6px;border:1px solid var(--line);margin-top:6px}
.img-field{display:flex;gap:8px}
.img-field input[type=url]{flex:1}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(110px,220px) 1fr 52px;gap:12px;align-items:center;font-size:.92rem}
.track{height:10px;border-radius:999px;background:var(--sand);overflow:hidden;display:block}
.fill{height:100%;border-radius:999px;background:var(--forest-2);display:block}
.bar b{text-align:right;font-family:var(--serif);font-size:1.15rem}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.login{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;background:var(--cream)}
.login .ph{position:relative;overflow:hidden;background:var(--forest)}
.login .ph img{width:100%;height:100%;object-fit:cover;opacity:.92}
.login .ph .logo{position:absolute;left:32px;top:28px;color:#fff}
.login .fm{display:grid;place-items:center;padding:32px 20px}
.login form{width:min(100%,400px)}
@media (max-width:860px){.login{grid-template-columns:1fr}.login .ph{display:none}}
.list-plain{list-style:none;margin:0;padding:0}
.list-plain li{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.list-plain li:last-child{border-bottom:0}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.reveal{opacity:1;transform:none}.hero .slide.on{transform:none}}
@media print{.site-header,.site-footer,.fab,.btn,.steps{display:none!important}body{background:#fff}}

/* Helpers */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
const fmtDate = (s, o) => s ? parseISO(s).toLocaleDateString('en-GB', o || { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtDay = s => fmtDate(s, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const fmtDT = s => s ? new Date(s).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const money = n => n == null || n === '' ? '' : 'P' + Number(n).toLocaleString('en-GB', { maximumFractionDigits: 2 });
const nights = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const digits = p => { let d = String(p || '').replace(/\D/g, ''); if (d.length === 8) d = '267' + d; return d; };
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const MODE = { instant: 'Instant confirmation', request: 'Confirmed by our team', quote: 'Quotation' };
const STATUS = { pending: 'Pending', confirmed: 'Confirmed', rejected: 'Rejected', cancelled: 'Cancelled', completed: 'Completed' };
const SOURCE = { website: 'Website', phone: 'Phone', walk_in: 'Walk-in', whatsapp: 'WhatsApp', email: 'Email' };
const ROLE_LABEL = { super_admin: 'Super Administrator', manager: 'Manager', receptionist: 'Receptionist', finance: 'Finance Officer', marketing: 'Marketing Officer' };
const pill = (k, label) => html`<span class="pill ${k}">${label ?? k}</span>`;
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const store = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } }, set(k, v) { try { sessionStorage.setItem(k, v); } catch {} } };

/* Public data */
const S = { settings: {}, services: [], packages: [], promos: [], gallery: [], menu: [], faqs: [], testimonials: [], ads: [], loaded: false };
const set = (k, f = '') => (S.settings[k] ?? '').trim() || f;
const lines = k => set(k).split(/\r?\n/).map(s => s.trim()).filter(Boolean);
const pairs = k => lines(k).map(l => l.split('|').map(s => s.trim()));
const priceText = s => s.price_from != null ? `From ${money(s.price_from)}${s.price_unit ? ' ' + s.price_unit : ''}` : (s.price_note || 'Price on request');
const svcById = id => S.services.find(s => s.id === id);
const svcBySlug = sl => S.services.find(s => s.slug === sl);
const waLink = (msg, num) => { const d = String(num ?? set('whatsapp')).replace(/\D/g, ''); return d ? `https://wa.me/${d}?text=${encodeURIComponent(msg || set('whatsapp_default'))}` : '#/contact'; };
const telHref = p => 'tel:' + String(p).replace(/[^\d+]/g, '');
const mapsQ = () => encodeURIComponent(set('map_query', set('business_name')));

async function loadSettings() {
  const { data, error } = await sb.from('settings').select('key,value');
  if (error) throw error;
  S.settings = Object.fromEntries(data.map(r => [r.key, r.value]));
}
async function loadPublic() {
  const t = todayISO();
  const q = await Promise.all([
    sb.from('settings').select('key,value'),
    sb.from('services').select('*').eq('active', true).order('sort'),
    sb.from('packages').select('*').eq('active', true).order('sort'),
    sb.from('promotions').select('*').eq('active', true).lte('start_date', t).gte('end_date', t).order('sort'),
    sb.from('gallery').select('*').eq('published', true).order('sort').order('created_at', { ascending: false }),
    sb.from('menu_items').select('*').eq('available', true).order('section').order('sort'),
    sb.from('faqs').select('*').eq('published', true).order('sort'),
    sb.from('testimonials').select('*').eq('published', true).order('sort'),
    sb.from('ads').select('*').eq('active', true).lte('start_date', t).gte('end_date', t).order('sort')
  ]);
  const bad = q.find(r => r.error);
  if (bad) throw bad.error;
  S.settings = Object.fromEntries(q[0].data.map(r => [r.key, r.value]));
  [S.services, S.packages, S.promos, S.gallery, S.menu, S.faqs, S.testimonials, S.ads] = q.slice(1).map(r => r.data);
  S.loaded = true;
}

/* UI primitives */
function toast(msg, type = 'ok', ms = 4200) {
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = String(html`${icon(type === 'error' ? 'ban' : 'check')}<div></div>`);
  el.lastChild.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), ms);
}
const modal = $('#modal');
let confirmResolve = null;
function openModal(title, body, opt = {}) {
  modal.className = opt.cls || '';
  modal.innerHTML = String(html`<div class="m-head"><h2 id="m-title">${title}</h2><button class="icon-btn" data-act="modal-close" aria-label="Close dialog">${icon('close')}</button></div><div class="m-body">${body}</div>`);
  modal.setAttribute('aria-labelledby', 'm-title');
  if (!modal.open) modal.showModal();
  const f = modal.querySelector('.m-body input:not([type=hidden]),.m-body select,.m-body textarea');
  if (f && !opt.noFocus) f.focus(); else $('[data-act=modal-close]', modal)?.focus();
}
function closeModal() { if (modal.open) modal.close(); }
modal.addEventListener('close', () => { if (confirmResolve) { confirmResolve(false); confirmResolve = null; } modal.innerHTML = ''; });
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
function confirmDialog(msg, ok = 'Confirm', danger = false) {
  return new Promise(res => {
    openModal('Please confirm', html`<p>${msg}</p><div class="row end"><button class="btn ghost" data-act="cf-no">Cancel</button><button class="btn ${danger ? 'danger' : ''}" data-act="cf-yes">${ok}</button></div>`);
    confirmResolve = res;
  });
}
const media = (url, alt, ic, eager) => { const u = safeUrl(url); return u ? html`<img src="${u}" alt="${alt}" ${eager ? '' : raw('loading="lazy"')} decoding="async">` : html`<div class="art">${icon(ic)}</div>`; };
const errText = e => (e && (e.message || e.error_description || e.error)) || 'Something went wrong. Please try again.';
function download(name, text, type = 'text/csv;charset=utf-8') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([type.startsWith('text/csv') ? '﻿' + text : text], { type }));
  a.download = name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
const csvCell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };

function calHtml() {
  const s = svcById(B.sid), t = todayISO(), max = addDays(t, 730);

  const y = B.month.getFullYear(), m = B.month.getMonth();
  const offset = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  const canPrev = new Date(y, m, 1) > new Date(parseISO(t).getFullYear(), parseISO(t).getMonth(), 1);
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(html`<span></span>`);
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${pad(m + 1)}-${pad(d)}`, st = B.avail[ds] || 'open';
    const dis = ds < t || ds > max || st === 'full' || st === 'blocked';
    const sel = ds === B.date || ds === B.end, rng = s.stay_mode && B.date && B.end && ds > B.date && ds < B.end;
    const lbl = `${fmtDay(ds)}${st === 'full' ? ', fully booked' : st === 'blocked' ? ', unavailable' : st === 'limited' ? ', few spaces left' : ''}${sel ? ', selected' : ''}`;
    cells.push(html`<button class="day ${st} ${ds === t ? 'today' : ''} ${sel ? 'sel' : ''} ${rng ? 'range' : ''}" data-act="b-day" data-d="${ds}" aria-label="${lbl}" aria-pressed="${tf(sel)}" ${dis ? 'disabled' : ''}>${d}</button>`);
  }
  return html`<div class="cal"><div class="cal-head"><button class="icon-btn" data-act="b-month" data-dir="-1" aria-label="Previous month" ${canPrev ? '' : 'disabled'}>${icon('back')}</button>
    <b aria-live="polite">${B.month.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })}</b><button class="icon-btn" data-act="b-month" data-dir="1" aria-label="Next month">${icon('arrow')}</button></div>
    <div class="cal-grid">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => html`<span class="cal-dow" aria-hidden="true">${d}</span>`)}${cells}</div>

}
async function loadAvail() {

function validateStep() {

    else if (s.stay_mode && !B.end) e.date = 'Please choose your check-out date.';

function downloadICS() {

function fieldHtml(f, v) {
  const id = 'f_' + f.k, t = f.t || 'text';
  const val = v ?? (typeof f.def === 'function' ? f.def() : f.def) ?? '';
  const help = f.help ? html`<small class="help">${f.help}</small>` : '';
  const cls = 'field' + (f.full ? ' full' : ''), req = f.req ? 'required' : '';
  if (t === 'bool') return html`<div class="${cls}" style="justify-content:flex-end"><label class="switch"><input type="checkbox" name="${f.k}" ${val === true ? 'checked' : ''}><span class="sw" aria-hidden="true"></span><span>${f.l}</span></label>${help}</div>`;
  let ctl;
  if (t === 'textarea') ctl = html`<textarea id="${id}" name="${f.k}" rows="${f.rows || 4}" maxlength="${f.max || 8000}" ${req}>${val}</textarea>`;
  else if (t === 'select') { const o = typeof f.opts === 'function' ? f.opts() : f.opts; ctl = html`<select id="${id}" name="${f.k}" ${req}>${o.map(x => html`<option value="${x.v}" ${String(x.v) === String(val ?? '') ? 'selected' : ''}>${x.l}</option>`)}</select>`; }
  else if (t === 'number' || t === 'money') ctl = html`<input id="${id}" name="${f.k}" type="number" inputmode="decimal" step="${t === 'money' ? '0.01' : '1'}" min="${f.min ?? 0}" value="${val}" ${req}>`;
  else if (t === 'image') { const u = safeUrl(val); ctl = html`<div class="img-field"><input id="${id}" name="${f.k}" type="url" placeholder="https:// link, or upload" value="${val}" ${req}><label class="btn sm ghost">${icon('upload')} Upload<input type="file" class="sr" accept="image/jpeg,image/png,image/webp,image/gif${f.video ? ',video/mp4,video/webm' : ''}" data-upload="${f.k}"></label></div>${u ? html`<img class="thumb" src="${u}" alt="Current image">` : ''}`; }
  else ctl = html`<input id="${id}" name="${f.k}" type="${['date', 'time', 'email', 'url'].includes(t) ? t : 'text'}" value="${val}" maxlength="${f.max || 300}" ${f.pattern ? raw(`pattern="${esc(f.pattern)}"`) : ''} ${f.list ? raw(`list="dl_${f.k}"`) : ''} ${req}>${f.list ? html`<datalist id="dl_${f.k}">${f.list.map(x => html`<option value="${x}">`)}</datalist>` : ''}`;
  return html`<div class="${cls}"><label for="${id}">${f.l}${f.req ? html`<span class="req" aria-hidden="true">*</span>` : ''}</label>${ctl}${help}</div>`;
}
function collect(fields, form) {
  const o = {};
  for (const f of fields) {
    const el = form.elements[f.k]; if (!el) continue;
    const t = f.t || 'text';
    if (t === 'bool') o[f.k] = el.checked;
    else if (t === 'number') o[f.k] = el.value === '' ? (f.def ?? 0) : parseInt(el.value, 10);
    else if (t === 'money') o[f.k] = el.value === '' ? null : Number(el.value);
    else if (t === 'select') o[f.k] = el.value === '' ? null : (f.k === 'rating' ? Number(el.value) : el.value);
    else if (t === 'date' || t === 'time') o[f.k] = el.value || null;
    else o[f.k] = el.value.trim();
  }
  return o;
}
const ALLOWED = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif', 'video/mp4': 'mp4', 'video/webm': 'webm' };
async function shrink(file) {
  if (!/^image\/(jpeg|png|webp)$/.test(file.type) || !window.createImageBitmap) return file;
  try {
    const bmp = await createImageBitmap(file), s = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
    if (s === 1 && file.size < 900 * 1024) return file;
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, 'image/jpeg', .84));
    return b ? new File([b], 'photo.jpg', { type: 'image/jpeg' }) : file;
  } catch { return file; }
}
async function uploadFile(file, folder = 'uploads') {
  if (!ALLOWED[file.type]) throw new Error('Unsupported file type. Use JPG, PNG, WebP, GIF, MP4 or WebM.');
  file = await shrink(file);
  if (file.size > 10 * 1024 * 1024) throw new Error('File is larger than 10 MB. Please use a smaller file.');
  const path = `${folder}/${Date.now()}-${crypto.getRandomValues(new Uint32Array(2)).join('')}.${ALLOWED[file.type]}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type, cacheControl: '31536000', upsert: false });
  if (error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

function notifyText(b, status) {
  const svc = b.services?.name || svcName(b.service_id), d = fmtDate(b.booking_date), n = firstName(b.customer_name), biz = set('business_name');

    completed: `Hello ${n}, thank you for visiting ${biz}. We hope you enjoyed ${svc} and would love your feedback.`

}

async function availabilityWarning(o, prev) {
  if (!['pending', 'confirmed'].includes(o.status)) return true;
  if (prev && prev.booking_date === o.booking_date && prev.service_id === o.service_id && (prev.end_date || null) === (o.end_date || null) && ['pending', 'confirmed'].includes(prev.status)) return true;
  const { data } = await sb.rpc('get_availability', { p_service_id: o.service_id, p_from: o.booking_date, p_to: o.end_date ? addDays(o.end_date, -1) : o.booking_date });
  const bad = (data || []).filter(d => d.state === 'full' || d.state === 'blocked');
  if (!bad.length) return true;
  return confirmDialog(`Careful: ${bad.map(d => fmtDate(d.day) + (d.state === 'full' ? ' is already fully booked' : ' is blocked')).join(', ')} for this experience. Save anyway? This may double-book.`, 'Save anyway', true);
}
async function setBookingStatus(id, status) {
  let b = A.bookings.find(x => x.id === id);
  if (!b) { const r = await sb.from('bookings').select('*, services(name)').eq('id', id).single(); b = r.data; }
  if (!b) return;
  if (['rejected', 'cancelled'].includes(status) && !(await confirmDialog(`Mark booking ${b.reference} as ${STATUS[status].toLowerCase()}?`, STATUS[status], true))) return;
  const { error } = await sb.from('bookings').update({ status }).eq('id', id);
  if (error) return toast(errText(error), 'error');
  b.status = status;
  toast(`Booking ${b.reference} is now ${STATUS[status].toLowerCase()}.`);
  notifyModal(b, status);
  const sec = location.hash.split('/')[2] || 'dashboard';
  if (sec === 'bookings') redrawBookings(); else ADM[sec]?.();
}

async function applyRequest(id) {
  const r = A.rows.requests.find(x => x.id === id); if (!r) return;
  const b = r.bookings;
  let patch;
  if (r.kind === 'cancel') { if (!(await confirmDialog(`Cancel booking ${b.reference} for ${b.customer_name}?`, 'Cancel booking', true))) return; patch = { status: 'cancelled' }; }
  else {
    const nb = { ...b, booking_date: r.preferred_date, end_date: b.end_date ? addDays(r.preferred_date, nights(b.booking_date, b.end_date)) : null };
    if (!(await availabilityWarning(nb, null))) return;
    patch = { booking_date: nb.booking_date, end_date: nb.end_date };
  }
  const { error } = await sb.from('bookings').update(patch).eq('id', b.id);
  if (error) return toast(errText(error), 'error');
  await sb.from('booking_requests').update({ status: 'done' }).eq('id', id);
  toast('Booking updated.');
  const nb = { ...b, ...patch };
  notifyModal(nb, nb.status, r.kind === 'cancel' ? null : `Hello ${firstName(b.customer_name)}, your booking ${b.reference} for ${b.services?.name} has been moved to ${fmtDay(nb.booking_date)}. ${set('business_name')}`);
  ADM.requests(); refreshCounts();
}

  A.repData = data;

  const pkey = b => { const d = r.basis === 'created_at' ? b.created_at.slice(0, 10) : b.booking_date; if (r.group === 'month') return d.slice(0, 7); if (r.group === 'week') { const x = parseISO(d); x.setDate(x.getDate() - (x.getDay() + 6) % 7); return iso(x); } return d; };

function repPreset(p) {
  const t = todayISO(), d = new Date(), r = A.rep;
  if (p === 'today') Object.assign(r, { from: t, to: t, group: 'day' });
  if (p === 'week') { const m = new Date(d); m.setDate(d.getDate() - (d.getDay() + 6) % 7); Object.assign(r, { from: iso(m), to: addDays(iso(m), 6), group: 'day' }); }
  if (p === 'month') Object.assign(r, { from: iso(new Date(d.getFullYear(), d.getMonth(), 1)), to: iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)), group: 'day' });
  if (p === '30') Object.assign(r, { from: addDays(t, -29), to: t, group: 'day' });
  if (p === 'next30') Object.assign(r, { from: t, to: addDays(t, 30), basis: 'booking_date', group: 'day' });
  if (p === 'year') Object.assign(r, { from: `${d.getFullYear()}-01-01`, to: `${d.getFullYear()}-12-31`, group: 'month' });
  ADM.reports();
}

  'set-tab': b => { A.setTab = b.dataset.g; ADM.settings(); },
  'staff-new': () => staffForm(),
  'staff-pass': b => openModal(`New password for ${b.dataset.email}`, html`<form data-form="staff-pass" data-id="${b.dataset.id}" novalidate><div class="field"><label for="sp-p">New password</label><div class="pw"><input id="sp-p" name="password" type="text" minlength="10" maxlength="128" required value="${genPassword()}" autocomplete="off"><button type="button" data-act="pw-gen" aria-controls="sp-p">New</button></div><small class="help">Share it privately with the staff member.</small></div><p class="err" data-err role="alert"></p><div class="row end"><button type="button" class="btn ghost" data-act="modal-close">Cancel</button><button class="btn" type="submit">Set password</button></div></form>`),
  'staff-del': async b => {
    if (!(await confirmDialog(`Delete the login for ${b.dataset.email}? They will no longer be able to sign in. To pause access instead, switch Access off.`, 'Delete login', true))) return;
    try { await staffCall({ action: 'delete', user_id: b.dataset.id }); toast('Login deleted.'); ADM.staff(); } catch (e) { toast(errText(e), 'error'); }
  }
};
function focusStep() { const h = $('#step h2'); if (!h) return; h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); $('#step').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
async function afterContentChange(k) {
  if (['services', 'packages'].includes(k)) await loadAdminCatalogue();
  await crudSection(k);
  loadPublic().catch(() => {});
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (t && ACT[t.dataset.act]) { e.preventDefault(); ACT[t.dataset.act](t, e); return; }
  if (e.target.closest('a[href^="#/"]') && $('#nav-links')?.classList.contains('open')) { $('#nav-links').classList.remove('open'); $('.menu-btn')?.setAttribute('aria-expanded', 'false'); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#nav-links')?.classList.contains('open')) { $('#nav-links').classList.remove('open'); $('.menu-btn')?.focus(); } });

const FORMS = {
  quick: f => { const v = Object.fromEntries(new FormData(f)); if (!v.service) { toast('Please choose what you are planning.', 'error'); f.service.focus(); return; } location.hash = `#/book?service=${encodeURIComponent(v.service)}${v.date ? '&date=' + v.date : ''}${v.guests ? '&guests=' + encodeURIComponent(v.guests) : ''}`; },
  enquiry: submitEnquiry,
  login: async f => {
    const v = Object.fromEntries(new FormData(f)), err = $('[data-err]', f);
    if (Date.now() < A.lockUntil) { err.textContent = `Too many attempts. Please wait ${Math.ceil((A.lockUntil - Date.now()) / 1000)} seconds.`; return; }
    if (!v.email || !v.password) { err.textContent = 'Enter your email and password.'; return; }
    const btn = $('button[type=submit]', f); btn.disabled = true; btn.textContent = 'Signing in';
    const { error } = await sb.auth.signInWithPassword({ email: v.email.trim(), password: v.password });
    if (error) { btn.disabled = false; btn.textContent = 'Sign in'; A.loginFails++; if (A.loginFails >= 5) { A.lockUntil = Date.now() + 60000; A.loginFails = 0; } err.textContent = 'That email and password do not match.'; return; }
    A.loginFails = 0; A.lastActive = Date.now(); A.staff = null;
    if (!location.hash.startsWith('#/admin')) location.hash = '#/admin'; else renderAdmin(location.hash.split('/')[2]);
  },
  'new-pass': async f => {
    const v = Object.fromEntries(new FormData(f)), err = $('[data-err]', f);
    if ((v.p1 || '').length < 10) { err.textContent = 'Use at least 10 characters.'; return; }
    if (v.p1 !== v.p2) { err.textContent = 'The passwords do not match.'; return; }
    const { error } = await sb.auth.updateUser({ password: v.p1 });
    if (error) { err.textContent = errText(error); return; }
    closeModal(); toast('Password updated.'); location.hash = '#/admin'; render();
  },
  'bk-save': async f => {
    const err = $('[data-err]', f), id = f.dataset.id;
    if (!f.checkValidity()) { err.textContent = 'Please complete the required fields.'; f.reportValidity(); return; }
    const o = collect(BK_FIELDS(), f);
    if (o.end_date && o.end_date <= o.booking_date) { err.textContent = 'Check-out must be after the booking date.'; return; }
    const prev = id ? A.bookings.find(x => x.id === id) : null;
    if (!(await availabilityWarning(o, prev))) return;
    const { data, error } = id ? await sb.from('bookings').update(o).eq('id', id).select('*, services(name)').single() : await sb.from('bookings').insert(o).select('*, services(name)').single();
    if (error) { if (modal.open) err.textContent = errText(error); else toast(errText(error), 'error'); return; }
    closeModal(); toast(id ? 'Booking updated.' : `Booking ${data.reference} added.`);
    const changed = !prev || prev.status !== data.status || prev.booking_date !== data.booking_date;
    await ADM[location.hash.split('/')[2] || 'dashboard']?.();
    if (changed) notifyModal(data, data.status);
  },
  'enq-note': async f => { const { error } = await sb.from('enquiries').update({ admin_notes: f.note.value.trim() }).eq('id', f.dataset.id); if (error) return toast(errText(error), 'error'); closeModal(); ADM.enquiries(); },
  rep: f => { const v = Object.fromEntries(new FormData(f)); if (!v.from || !v.to || v.to < v.from) { toast('Choose a valid date range.', 'error'); return; } Object.assign(A.rep, v); runReport(); },
  crud: async f => {
    const k = f.dataset.key, E = ENT[k], id = f.dataset.id, err = $('[data-err]', f);
    if (!f.checkValidity()) { err.textContent = 'Please check the highlighted fields.'; f.reportValidity(); return; }
    const o = collect(E.fields, f);
    if (o.image_url && !safeUrl(o.image_url)) { err.textContent = 'Image links must start with https://'; return; }
    if (k === 'ads' && o.cta_link && !safeLink(o.cta_link)) { err.textContent = 'The button link must start with #/ or https://'; return; }
    if (k === 'services') { if (o.time_slots && !o.time_slots.split(',').every(t => /^[0-2]\d:[0-5]\d$/.test(t.trim()))) { err.textContent = 'Start times must look like 09:00,12:00'; return; } o.time_slots = o.time_slots.split(',').map(t => t.trim()).filter(Boolean).join(','); }
    const btn = $('button[type=submit]', f); btn.disabled = true;
    const { error } = id ? await sb.from(E.table).update(o).eq('id', id) : await sb.from(E.table).insert(o);
    btn.disabled = false;
    if (error) { err.textContent = error.code === '23505' ? 'That web address is already used.' : errText(error); return; }
    closeModal(); toast('Saved.'); await afterContentChange(k);
  },
  settings: async f => {
    const err = $('[data-err]', f), changed = A.rows.settings.filter(s => f.elements[s.key] && f.elements[s.key].value !== s.value);
    if (!changed.length) { toast('No changes to save.'); return; }
    for (const s of changed) { const v = f.elements[s.key].value; if ((s.kind === 'url' || s.kind === 'image') && v && !safeUrl(v)) { err.textContent = `${s.label}: links must start with https://`; return; } }
    const btn = $('button[type=submit]', f); btn.disabled = true;
    const res = await Promise.all(changed.map(s => sb.from('settings').update({ value: f.elements[s.key].value.trim() }).eq('key', s.key)));
    btn.disabled = false;
    const bad = res.find(r => r.error);
    if (bad) { err.textContent = errText(bad.error); return; }
    toast(`Saved ${changed.length} change(s). The website is updated.`);
    await loadPublic().catch(() => {}); ADM.settings();
  },
  'staff-add': async f => {
    const v = Object.fromEntries(new FormData(f)), err = $('[data-err]', f), btn = $('button[type=submit]', f);
    if (!v.name.trim() || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v.email.trim())) { err.textContent = 'Enter a name and a valid email.'; return; }
    if (v.password.length < 10) { err.textContent = 'The temporary password needs at least 10 characters.'; return; }
    btn.disabled = true; btn.textContent = 'Creating';
    try { await staffCall({ action: 'create', email: v.email.trim(), full_name: v.name.trim(), role: v.role, password: v.password }); }
    catch (e) { btn.disabled = false; btn.textContent = 'Create login'; err.textContent = errText(e); return; }
    openModal('Login created', html`<p><b>${v.name}</b> can now sign in at <b>Staff login</b> with:</p><dl class="hours" style="grid-template-columns:auto 1fr"><dt>Email</dt><dd>${v.email}</dd><dt>Temporary password</dt><dd class="mono">${v.password}</dd><dt>Role</dt><dd>${ROLE_LABEL[v.role]}</dd></dl><p class="muted small" style="margin-top:14px">Share these privately. This password is not shown again.</p><div class="row end"><button class="btn" data-act="modal-close">Done</button></div>`);
    ADM.staff();
  },
  'staff-pass': async f => {
    const err = $('[data-err]', f), pw = f.password.value;
    if (pw.length < 10) { err.textContent = 'Use at least 10 characters.'; return; }
    try { await staffCall({ action: 'reset_password', user_id: f.dataset.id, password: pw }); } catch (e) { err.textContent = errText(e); return; }
    closeModal(); toast('Password updated. Share it privately with the staff member.');
  }
};
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form]?.(f, e); });

const redrawCust = debounce(q => { const b = $('#cs-body'); if (b) b.innerHTML = String(custRows(q)); }, 150);
const redrawCrud = debounce((k, q) => { const b = $('#crud-body'); if (b) b.innerHTML = String(crudRows(k, q)); }, 150);
const redrawBk = debounce(redrawBookings, 150);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.b) { B[t.dataset.b] = t.type === 'checkbox' ? t.checked : t.value; if (B.errors[t.dataset.b]) { delete B.errors[t.dataset.b]; t.removeAttribute('aria-invalid'); $('#err-' + t.dataset.b)?.remove(); } if (t.dataset.b === 'guests') $('#bsum').innerHTML = String(bookSummary()); }
  if (t.dataset.bf) { A.bf[t.dataset.bf] = t.value; redrawBk(); }
  if (t.hasAttribute('data-cust-q')) redrawCust(t.value);
  if (t.dataset.crudQ) redrawCrud(t.dataset.crudQ, t.value);
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.b && t.type === 'checkbox') { B[t.dataset.b] = t.checked; if (t.dataset.b === 'agree' && t.checked) { delete B.errors.agree; $('#err-agree')?.remove(); } }
  if (t.dataset.upload) {
    const file = t.files[0]; if (!file) return;
    const wrap = t.closest('.field'), inp = $('input[type=url]', wrap);
    toast('Uploading');
    try { inp.value = await uploadFile(file, 'content'); let th = $('.thumb', wrap); if (!th) { th = document.createElement('img'); th.className = 'thumb'; th.alt = 'Uploaded image'; wrap.append(th); } if (file.type.startsWith('image/')) th.src = inp.value; const mt = t.form?.elements.media_type; if (mt) mt.value = file.type.startsWith('video/') ? 'video' : 'image'; toast('Uploaded.'); }
    catch (er) { toast(errText(er), 'error'); }
    t.value = '';
  }
  if (t.dataset.bulk) {
    const files = [...t.files]; if (!files.length) return;
    toast(`Uploading ${files.length} file(s)`);
    let ok = 0;
    for (const file of files) { try { const url = await uploadFile(file, 'gallery'); const { error } = await sb.from('gallery').insert({ image_url: url, caption: '', category: 'Gardens', media_type: file.type.startsWith('video/') ? 'video' : 'image' }); if (error) throw error; ok++; } catch (er) { toast(`${file.name}: ${errText(er)}`, 'error'); } }
    t.value = ''; toast(`${ok} file(s) added. Edit them to add captions and categories.`); afterContentChange('gallery');
  }
  if (t.dataset.change === 'crud-toggle') {
    const E = ENT[t.dataset.key];
    const { error } = await sb.from(E.table).update({ [E.toggle]: t.checked }).eq('id', t.dataset.id);
    if (error) { t.checked = !t.checked; return toast(errText(error), 'error'); }
    const r = A.rows[t.dataset.key].find(x => x.id === t.dataset.id); if (r) r[E.toggle] = t.checked;
    toast(t.checked ? 'Now showing on the website.' : 'Hidden from the website.');
    if (['services', 'packages'].includes(t.dataset.key)) loadAdminCatalogue();
    loadPublic().catch(() => {});
  }
  if (t.dataset.change === 'enq-status') { const { error } = await sb.from('enquiries').update({ status: t.value }).eq('id', t.dataset.id); if (error) return toast(errText(error), 'error'); toast('Status updated.'); refreshCounts(); }
  if (t.dataset.change === 'staff-role') { const { error } = await sb.from('staff').update({ role: t.value }).eq('user_id', t.dataset.id); if (error) return toast(errText(error), 'error'); toast('Role updated.'); }
  if (t.dataset.change === 'staff-active') { const { error } = await sb.from('staff').update({ active: t.checked }).eq('user_id', t.dataset.id); if (error) { t.checked = !t.checked; return toast(errText(error), 'error'); } toast(t.checked ? 'Access switched on.' : 'Access switched off.'); }
});

/* Sign staff out after 30 minutes without activity */
['pointerdown', 'keydown', 'scroll'].forEach(ev => document.addEventListener(ev, () => { A.lastActive = Date.now(); }, { passive: true }));
setInterval(async () => { if (A.staff && Date.now() - A.lastActive > IDLE_LIMIT_MS) { await sb.auth.signOut(); A.staff = null; toast('Signed out after 30 minutes without activity.'); if (location.hash.startsWith('#/admin')) render(); } }, 60000);
sb.auth.onAuthStateChange(event => {
  if (event === 'PASSWORD_RECOVERY') setTimeout(() => openModal('Choose a new password', html`<form data-form="new-pass" novalidate>${pwField('np1', 'p1', 'New password', 'new-password', 'minlength="10"')}${pwField('np2', 'p2', 'Type it again', 'new-password', 'minlength="10"')}<p class="err" data-err role="alert"></p><button class="btn" type="submit">Save password</button></form>`), 300);
  if (event === 'SIGNED_OUT') A.staff = null;
});

/* ================= Router ================= */
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { rootMargin: '0px 0px -6% 0px' }) : null;
const TITLES = { about: 'Our story', services: 'Experiences', packages: 'Packages and pricing', book: 'Book online', gallery: 'Gallery', restaurant: 'Dining', contact: 'Visit us', privacy: 'Privacy policy', terms: 'Terms' };
const onScroll = () => document.body.classList.toggle('scrolled', window.scrollY > 40);
window.addEventListener('scroll', onScroll, { passive: true });
function parseHash() {
  const h = location.hash;
  if (h && !h.startsWith('#/')) return null;
  const [p, qs] = (h.slice(2) || '').split('?');
  return { path: p.split('/').filter(Boolean).map(decodeURIComponent), q: Object.fromEntries(new URLSearchParams(qs || '')) };
}
let publicReady = null;
async function render() {
  const r = parseHash(); if (!r) return;
  const { path, q } = r;
  if (path[0] === 'admin') { clearInterval(heroTimer); if (!S.settings.business_name) await loadSettings().catch(() => {}); renderAdmin(path[1]); return; }
  renderToken++;
  if (!S.loaded) { publicReady ||= loadPublic(); try { await publicReady; } catch (e) { publicReady = null; $('#main').innerHTML = String(html`<div class="wrap" style="padding:120px 16px"><div class="empty">${icon('ban')}<p>We could not load the website right now. Please check your connection.</p><button class="btn sm" data-act="reload">Try again</button></div></div>`); ACT.reload = () => location.reload(); return; } }
  if (modal.open && !modal.classList.contains('ad-pop')) closeModal();
  document.body.classList.remove('is-admin');
  clearInterval(heroTimer);
  const pg = path[0] || '';
  if (pg !== 'book' && B.result) resetBooking();
  const heroPage = pg === '' || (pg === 'services' && path[1] && safeUrl((svcBySlug(path[1]) || {}).image_url));
  document.body.classList.toggle('has-hero', !!heroPage);
  renderChrome(path);
  let view;
  switch (pg) {
    case '': view = pageHome(); break;
    case 'about': view = pageAbout(); break;
    case 'services': view = path[1] ? pageService(path[1]) : pageServices(q); break;
    case 'packages': view = pagePackages(); break;
    case 'book': view = pageBook(q); break;
    case 'gallery': view = pageGallery(q); break;
    case 'restaurant': view = pageRestaurant(); break;
    case 'contact': view = pageContact(); break;
    case 'privacy': case 'terms': view = pageLegal(pg); break;
    default: view = page404();
  }
  const main = $('#main');
  main.innerHTML = String(view);
  const svc = pg === 'services' && path[1] ? svcBySlug(path[1]) : pg === 'book' ? svcById(B.sid) : null;
  setFab(svc ? svc.whatsapp_message : set('whatsapp_default'));
  const name = set('business_name', 'Grand Bay Botanical Gardens & Resort');
  const ttl = pg === 'services' && svc ? svc.name : TITLES[pg];
  document.title = ttl ? `${ttl} | ${name}` : `${name} | ${set('tagline')}`;
  const md = document.querySelector('meta[name=description]'); if (md && svc && pg === 'services') md.content = `${svc.name} at ${name}: ${svc.tagline}`;
  $$('.reveal', main).forEach(el => io ? io.observe(el) : el.classList.add('in'));
  if (pg === '') { startHero(); maybePopupAd(); }
  if (pg === 'book' && B.step === 2) loadAvail();
  window.scrollTo(0, 0); onScroll();
  const h1 = $('h1', main); if (h1 && document.activeElement !== document.body) h1.focus({ preventScroll: true });
}
window.addEventListener('hashchange', render);
(async () => {
  if (location.search.includes('code=')) { await sb.auth.getSession(); history.replaceState(null, '', location.pathname + (location.hash || '#/admin')); }
  render();
})();
})();
</script>
