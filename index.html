<style>
:root{
  --bg:#04100b;--bg-2:#06170f;--panel:rgba(16,44,32,.5);--panel-solid:#0b2018;--panel-2:#0f2a20;
  --line:rgba(160,255,210,.13);--line-2:rgba(160,255,210,.3);
  --text:#ecfbf3;--muted:#a6c7b7;--faint:#7c9f8f;
  --mint:#7cf5b0;--cyan:#62e3ff;--gold:#f6d27d;--rose:#ff8197;--amber:#ffc66d;--wa:#25d366;
  --grad:linear-gradient(120deg,var(--mint),var(--cyan));
  --r:22px;--r-sm:14px;--r-xs:10px;
  --shadow:0 24px 70px -24px rgba(0,0,0,.75);
  --font-d:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;--font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
  --max:1200px;--gut:clamp(16px,4vw,32px);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 var(--font);min-height:100vh;overflow-x:hidden}
body::before{content:"";position:fixed;inset:-20vmax;z-index:-2;pointer-events:none;
  background:radial-gradient(40vmax 30vmax at 15% 10%,rgba(124,245,176,.13),transparent 60%),
  radial-gradient(35vmax 30vmax at 85% 20%,rgba(98,227,255,.10),transparent 60%),
  radial-gradient(40vmax 35vmax at 60% 95%,rgba(246,210,125,.07),transparent 60%);animation:aurora 28s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.35;
  background-image:linear-gradient(rgba(160,255,210,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(160,255,210,.05) 1px,transparent 1px);
  background-size:56px 56px;mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 10%,transparent 70%)}
@keyframes aurora{to{transform:translate3d(4vmax,-3vmax,0) rotate(8deg)}}
img{max-width:100%;display:block}
a{color:var(--mint);text-decoration:none}
a:hover{text-decoration:underline;text-underline-offset:3px}
h1,h2,h3,h4{font-family:var(--font-d);line-height:1.15;margin:0 0 .5em;letter-spacing:-.01em}
h1{font-size:clamp(2.2rem,5.4vw,4.2rem);font-weight:700}
h2{font-size:clamp(1.7rem,3.4vw,2.6rem);font-weight:600}
h3{font-size:1.2rem;font-weight:600}
p{margin:0 0 1em}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px;border-radius:6px}
::selection{background:rgba(124,245,176,.35)}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding:0 var(--gut)}
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--mint);color:#04100b;padding:10px 16px;border-radius:10px;font-weight:600}
.skip:focus{top:12px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em}
.grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:.875rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.row.end{justify-content:flex-end}.row.between{justify-content:space-between}
.stack>*+*{margin-top:14px}

/* Buttons */
.btn{--bh:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:var(--bh);padding:0 20px;border-radius:999px;border:0;cursor:pointer;
  font:600 .95rem/1 var(--font);color:#03140c;background:var(--grad);box-shadow:0 8px 30px -10px rgba(124,245,176,.6);transition:transform .2s,box-shadow .2s,filter .2s;text-decoration:none!important;white-space:nowrap}
.btn:hover{transform:translateY(-2px);box-shadow:0 14px 34px -10px rgba(124,245,176,.75)}
.btn:active{transform:translateY(0)}
.btn[disabled],.btn[aria-disabled=true]{opacity:.5;cursor:not-allowed;transform:none}
.btn.ghost{background:rgba(255,255,255,.04);color:var(--text);border:1px solid var(--line-2);box-shadow:none}
.btn.ghost:hover{border-color:var(--mint);background:rgba(124,245,176,.08)}
.btn.wa{background:var(--wa);color:#03140c;box-shadow:0 8px 30px -10px rgba(37,211,102,.6)}
.btn.danger{background:var(--rose);color:#200409;box-shadow:none}
.btn.sm{--bh:36px;padding:0 14px;font-size:.85rem}
.btn.xs{--bh:30px;padding:0 10px;font-size:.8rem}
.btn.lg{--bh:54px;padding:0 26px;font-size:1rem}
.icon-btn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--text);cursor:pointer}
.icon-btn:hover{border-color:var(--line-2)}

/* Header */
.announce{background:var(--grad);color:#03140c;text-align:center;font-weight:600;font-size:.9rem;padding:8px var(--gut)}
.site-header{position:sticky;top:0;z-index:40;backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);background:rgba(4,16,11,.72);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;gap:18px;min-height:72px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);font:700 1.15rem/1.1 var(--font-d);text-decoration:none!important;margin-right:auto}
.brand img{height:40px;width:auto}
.brand small{display:block;font:500 .7rem/1.2 var(--font);color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.emblem{width:40px;height:40px;flex:none}
.nav-links{display:flex;gap:4px;align-items:center;list-style:none;margin:0;padding:0}
.nav-links a{display:block;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:500;font-size:.95rem;text-decoration:none}
.nav-links a:hover{color:var(--text);background:rgba(255,255,255,.05)}
.nav-links a[aria-current=page]{color:var(--text);background:rgba(124,245,176,.1);box-shadow:inset 0 -2px 0 var(--mint)}
.nav-cta{display:flex;gap:8px;align-items:center}
.menu-btn{display:none}
@media (max-width:1060px){
  .menu-btn{display:inline-grid}
  .nav-links{position:fixed;inset:72px 0 auto 0;flex-direction:column;align-items:stretch;gap:2px;padding:12px var(--gut) 20px;background:rgba(4,16,11,.97);border-bottom:1px solid var(--line);transform:translateY(-8px);opacity:0;visibility:hidden;transition:.2s;max-height:calc(100vh - 72px);overflow:auto}
  .nav-links.open{opacity:1;visibility:visible;transform:none}
  .nav-links a{padding:14px 12px;font-size:1.05rem}
  .nav-cta .hide-m{display:none}
}

/* Sections */
section{padding:clamp(56px,8vw,104px) 0}
.sec-head{max-width:720px;margin-bottom:36px}
.sec-head.center{margin-inline:auto;text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:600 .78rem/1 var(--font);letter-spacing:.14em;text-transform:uppercase;color:var(--mint);margin-bottom:16px;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:rgba(124,245,176,.06)}
.lead{font-size:clamp(1.05rem,1.6vw,1.2rem);color:var(--muted);max-width:640px}
.page-head{padding:clamp(48px,7vw,88px) 0 24px}
.page-head .lead{margin-bottom:0}
.crumbs{display:flex;gap:8px;color:var(--faint);font-size:.85rem;margin-bottom:18px;flex-wrap:wrap}
.crumbs a{color:var(--muted)}

/* Cards */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.card.pad{padding:clamp(20px,3vw,32px)}
.card.hover{transition:transform .25s,border-color .25s,box-shadow .25s}
.card.hover:hover{transform:translateY(-4px);border-color:var(--line-2);box-shadow:var(--shadow),0 0 40px -12px rgba(124,245,176,.35)}
.grid{display:grid;gap:clamp(14px,2vw,22px)}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}

/* Hero */
.hero{position:relative;padding:clamp(40px,7vw,96px) 0 clamp(40px,6vw,72px);overflow:hidden}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:-1;opacity:.35;mask-image:linear-gradient(180deg,#000 40%,transparent);-webkit-mask-image:linear-gradient(180deg,#000 40%,transparent)}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero h1{margin-bottom:20px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;margin:28px 0 18px}
.tag-line{font-family:var(--font-d);color:var(--gold);letter-spacing:.02em;margin:0}
.orbit{position:relative;aspect-ratio:1;max-width:460px;width:100%;margin-inline:auto}
.core{position:absolute;inset:26%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9ffe9,var(--mint) 25%,#0d6b4a 60%,#03251a 100%);box-shadow:0 0 80px 10px rgba(124,245,176,.35),inset -20px -30px 60px rgba(0,0,0,.45);animation:float 7s ease-in-out infinite}
.core::after{content:"";position:absolute;inset:-14%;border-radius:50%;background:radial-gradient(circle,rgba(124,245,176,.25),transparent 65%)}
.ring{position:absolute;inset:8%;border-radius:50%;border:1px solid var(--line-2);animation:spin 40s linear infinite}
.ring.r2{inset:0;border-style:dashed;border-color:rgba(98,227,255,.25);animation-duration:60s;animation-direction:reverse}
.ring.r3{inset:16%;transform:rotateX(70deg);border:1.5px solid rgba(246,210,125,.35);animation:none}
.ring::before{content:"";position:absolute;top:-5px;left:50%;width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 16px var(--cyan)}
.chip{position:absolute;display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;background:rgba(6,23,15,.8);border:1px solid var(--line-2);font-size:.8rem;font-weight:600;color:var(--text);backdrop-filter:blur(10px);box-shadow:0 10px 30px -10px rgba(0,0,0,.7);animation:float 6s ease-in-out infinite}
.chip .ic{color:var(--mint)}
.chip.c0{top:4%;left:8%}.chip.c1{top:16%;right:-2%;animation-delay:-1s}.chip.c2{top:46%;left:-6%;animation-delay:-2s}
.chip.c3{bottom:18%;right:-4%;animation-delay:-3s}.chip.c4{bottom:2%;left:16%;animation-delay:-4s}.chip.c5{top:58%;right:20%;animation-delay:-5s;display:none}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{50%{transform:translateY(-10px)}}
@media (max-width:900px){.hero-grid{grid-template-columns:1fr}.orbit{max-width:250px}.chip{font-size:.72rem;padding:6px 10px}}

/* Quick booking bar */
.quick{margin-top:clamp(32px,5vw,56px);display:grid;grid-template-columns:1.4fr 1fr .7fr auto;gap:12px;padding:14px;border-radius:var(--r)}
.quick .field{margin:0}
@media (max-width:820px){.quick{grid-template-columns:1fr 1fr}.quick .btn{grid-column:1/-1}}
@media (max-width:480px){.quick{grid-template-columns:1fr}}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-top:28px}
.stat{padding:22px;border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(255,255,255,.03)}
.stat b{display:block;font:700 2rem/1 var(--font-d);margin-bottom:6px}
.stat span{color:var(--muted);font-size:.9rem}

/* Service cards */
.svc{display:flex;flex-direction:column;overflow:hidden}
.svc-media{display:block;aspect-ratio:16/10;overflow:hidden;border-bottom:1px solid var(--line)}
.svc-media img{width:100%;height:100%;object-fit:cover;transition:transform .6s}
.svc:hover .svc-media img{transform:scale(1.05)}
.svc-body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.svc-body h3 a{color:var(--text)}
.svc-body p{color:var(--muted);font-size:.95rem;flex:1}
.kicker{font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--cyan);margin-bottom:6px;display:block}
.svc-foot{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:4px 0 16px;flex-wrap:wrap}
.price{font-family:var(--font-d);font-weight:600;color:var(--gold)}
.art{position:relative;width:100%;height:100%;min-height:100%;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 25% 25%,hsl(var(--h,150) 85% 60% / .45),transparent 55%),radial-gradient(circle at 80% 80%,hsl(calc(var(--h,150) + 50) 85% 55% / .35),transparent 55%),linear-gradient(160deg,#0c271c,#06150f)}
.art::before{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;border:1px dashed rgba(255,255,255,.18);animation:spin 50s linear infinite}
.art::after{content:"";position:absolute;width:45%;aspect-ratio:1;border-radius:50%;border:1px solid rgba(255,255,255,.12)}
.art .ic{width:30%;height:auto;max-width:96px;color:rgba(236,251,243,.9);filter:drop-shadow(0 0 18px hsl(var(--h,150) 90% 60% / .8));stroke-width:1.2}

/* Badges */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.75rem;font-weight:600;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--muted);white-space:nowrap}
.pill.mint,.pill.confirmed,.pill.instant,.pill.closed,.pill.done{color:var(--mint);border-color:rgba(124,245,176,.35);background:rgba(124,245,176,.08)}
.pill.amber,.pill.pending,.pill.request,.pill.new,.pill.open{color:var(--amber);border-color:rgba(255,198,109,.35);background:rgba(255,198,109,.08)}
.pill.cyan,.pill.quote,.pill.completed,.pill.in_progress{color:var(--cyan);border-color:rgba(98,227,255,.35);background:rgba(98,227,255,.08)}
.pill.rose,.pill.rejected,.pill.cancelled,.pill.declined{color:var(--rose);border-color:rgba(255,129,151,.35);background:rgba(255,129,151,.08)}

/* Feature list */
.ticks{list-style:none;padding:0;margin:0 0 1em;display:grid;gap:10px}
.ticks li{display:flex;gap:10px;align-items:flex-start}
.ticks .ic{color:var(--mint);margin-top:3px}

/* Promotions */
.promo{overflow:hidden;display:grid;grid-template-columns:140px 1fr}
.promo .pm{min-height:100%}
.promo .pm img{width:100%;height:100%;object-fit:cover}
.promo .pb{padding:20px}
@media (max-width:520px){.promo{grid-template-columns:1fr}.promo .pm{height:140px}}

/* Gallery */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.chip-btn{padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);font:500 .9rem var(--font);cursor:pointer}
.chip-btn:hover{color:var(--text);border-color:var(--line-2)}
.chip-btn[aria-pressed=true]{background:rgba(124,245,176,.14);color:var(--text);border-color:var(--mint)}
.masonry{columns:3 260px;column-gap:14px}
.masonry figure{break-inside:avoid;margin:0 0 14px;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--line);position:relative;cursor:zoom-in;background:var(--panel-solid)}
.masonry figure img,.masonry figure video{width:100%;transition:transform .5s}
.masonry figure:hover img{transform:scale(1.04)}
.masonry figcaption{position:absolute;inset:auto 0 0 0;padding:28px 14px 12px;font-size:.85rem;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.masonry button{all:unset;display:block;cursor:zoom-in}
.masonry button:focus-visible{outline:2px solid var(--cyan)}
.empty{text-align:center;padding:48px 20px;border:1px dashed var(--line-2);border-radius:var(--r);color:var(--muted)}
.empty .ic{width:42px;height:42px;color:var(--mint);margin:0 auto 12px;display:block}

/* Testimonials */
.quote{font-size:1.05rem}
.stars{color:var(--gold);display:flex;gap:2px;margin-bottom:10px}
.stars .ic{fill:currentColor}

/* FAQ */
.faq details{border:1px solid var(--line);border-radius:var(--r-sm);background:rgba(255,255,255,.025);margin-bottom:10px}
.faq summary{cursor:pointer;padding:18px 20px;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";color:var(--mint);font-size:1.3rem;line-height:1}
.faq details[open] summary::after{content:"–"}
.faq details>div{padding:0 20px 18px;color:var(--muted)}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px;min-width:0}
.field label,.lbl{font-size:.85rem;font-weight:600;color:var(--muted)}
.req{color:var(--rose);margin-left:3px}
input,select,textarea{width:100%;font:inherit;font-size:16px;color:var(--text);background:rgba(4,16,11,.6);border:1px solid var(--line-2);border-radius:var(--r-xs);padding:12px 14px;min-height:48px;transition:border-color .2s,box-shadow .2s}
textarea{min-height:110px;resize:vertical}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mint) 50%),linear-gradient(135deg,var(--mint) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 15px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:40px}
select option{background:#0b2018}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--mint);box-shadow:0 0 0 4px rgba(124,245,176,.15)}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--mint);flex:none;margin:2px 0 0}
input[type=date]::-webkit-calendar-picker-indicator,input[type=time]::-webkit-calendar-picker-indicator{filter:invert(1) opacity(.7)}
[aria-invalid=true]{border-color:var(--rose)!important}
.err{color:var(--rose);font-size:.85rem}
.help{color:var(--faint);font-size:.8rem}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;color:var(--muted);margin-bottom:12px;cursor:pointer}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 16px}
.form-grid .full{grid-column:1/-1}
@media (max-width:640px){.form-grid{grid-template-columns:1fr}}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.switch{display:flex;gap:12px;align-items:center;cursor:pointer;margin-bottom:16px;font-weight:500}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.sw{width:44px;height:26px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--line-2);position:relative;flex:none;transition:.2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--text);transition:.2s}
.switch input:checked+.sw{background:var(--mint)}
.switch input:checked+.sw::after{left:21px;background:#03140c}
.switch input:focus-visible+.sw{outline:2px solid var(--cyan);outline-offset:3px}

/* Booking wizard */
.book-grid{display:grid;grid-template-columns:1fr 340px;gap:24px;align-items:start}
@media (max-width:960px){.book-grid{grid-template-columns:1fr}}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;list-style:none;padding:0;margin:0 0 24px;counter-reset:s}
.steps li{display:flex;flex-direction:column;gap:8px;font-size:.82rem;color:var(--faint);font-weight:600}
.steps li::before{content:"";height:4px;border-radius:4px;background:rgba(255,255,255,.1)}
.steps li[data-s=done]{color:var(--muted)}.steps li[data-s=done]::before{background:var(--mint)}
.steps li[data-s=now]{color:var(--text)}.steps li[data-s=now]::before{background:var(--grad);box-shadow:0 0 14px rgba(124,245,176,.6)}
.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.opt{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:var(--r-sm);border:1px solid var(--line);background:rgba(255,255,255,.025);cursor:pointer;transition:.2s}
.opt:hover{border-color:var(--line-2);background:rgba(255,255,255,.05)}
.opt:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.opt[aria-pressed=true],.opt[aria-checked=true]{border-color:var(--mint);background:rgba(124,245,176,.1);box-shadow:0 0 0 1px var(--mint) inset}
.opt .oi{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:rgba(124,245,176,.1);color:var(--mint);flex:none}
.opt b{display:block;font-family:var(--font-d);font-size:1rem}
.opt small{color:var(--muted);display:block;margin-top:2px}
.cal{border:1px solid var(--line);border-radius:var(--r-sm);padding:14px;background:rgba(255,255,255,.02)}
.cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cal-head b{font-family:var(--font-d);font-size:1.1rem}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{text-align:center;font-size:.72rem;color:var(--faint);font-weight:600;padding:4px 0}
.day{all:unset;box-sizing:border-box;aspect-ratio:1;display:grid;place-items:center;border-radius:12px;font-weight:600;font-size:.95rem;cursor:pointer;border:1px solid transparent;position:relative;min-height:38px}
.day:hover:not([disabled]){border-color:var(--line-2);background:rgba(255,255,255,.05)}
.day:focus-visible{outline:2px solid var(--cyan)}
.day[disabled]{color:rgba(236,251,243,.25);cursor:not-allowed}
.day.full,.day.blocked{text-decoration:line-through;color:rgba(255,129,151,.55)}
.day.limited::after{content:"";position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--amber)}
.day.today{border-color:var(--line-2)}
.day.sel{background:var(--grad);color:#03140c}
.day.range{background:rgba(124,245,176,.15)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.summary dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0 0 16px;font-size:.92rem}
.summary dt{color:var(--faint)}.summary dd{margin:0;text-align:right;font-weight:500}
.ref{font:700 clamp(1.6rem,4vw,2.4rem)/1 var(--font-d);letter-spacing:.06em;padding:16px 20px;border-radius:var(--r-sm);border:1px dashed var(--mint);display:inline-block;margin:6px 0 18px;background:rgba(124,245,176,.06)}
.success-ic{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--grad);color:#03140c;margin-bottom:20px;box-shadow:0 0 50px rgba(124,245,176,.5)}
.success-ic .ic{width:36px;height:36px;stroke-width:2.5}

/* Contact */
.contact-card{display:flex;gap:14px;align-items:flex-start}
.contact-card .oi{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:rgba(124,245,176,.1);color:var(--mint);flex:none}
.map{width:100%;aspect-ratio:16/10;border:0;border-radius:var(--r-sm);filter:grayscale(.3) invert(.9) hue-rotate(180deg) contrast(.9)}
.hours{display:grid;grid-template-columns:1fr auto;gap:6px 16px;margin:0}
.hours dt{color:var(--muted)}.hours dd{margin:0;font-weight:600}

/* Menu */
.menu-sec h3{display:flex;align-items:center;gap:10px;color:var(--gold)}
.menu-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px dashed var(--line)}
.menu-item img{width:72px;height:72px;border-radius:12px;object-fit:cover;flex:none}
.menu-item .mi{flex:1;min-width:0}
.menu-item .mt{display:flex;justify-content:space-between;gap:12px;font-weight:600}
.menu-item .mt span:last-child{color:var(--gold);font-family:var(--font-d);white-space:nowrap}
.menu-item p{margin:2px 0 0;color:var(--muted);font-size:.9rem}

/* Footer */
.site-footer{border-top:1px solid var(--line);padding:56px 0 110px;background:linear-gradient(180deg,transparent,rgba(124,245,176,.03));margin-top:40px}
.foot-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:32px}
.foot-grid h4{font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:14px}
.foot-grid ul{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.foot-grid a{color:var(--muted)}
.foot-grid a:hover{color:var(--text)}
.socials{display:flex;gap:8px;margin-top:14px}
.foot-bottom{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:40px;padding-top:20px;border-top:1px solid var(--line);color:var(--faint);font-size:.85rem}
.foot-bottom a{color:var(--faint)}
@media (max-width:860px){.foot-grid{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.foot-grid{grid-template-columns:1fr}}

/* Floating WhatsApp */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));z-index:45;display:inline-flex;align-items:center;gap:10px;padding:0 20px 0 16px;height:56px;border-radius:999px;background:var(--wa);color:#03140c;font-weight:700;box-shadow:0 12px 40px -8px rgba(37,211,102,.7);text-decoration:none!important;transition:transform .2s}
.fab:hover{transform:translateY(-3px) scale(1.02)}
.fab .ic{width:26px;height:26px}
.fab::before{content:"";position:absolute;inset:0;border-radius:inherit;border:2px solid var(--wa);animation:pulse 2.4s ease-out infinite}
@keyframes pulse{from{transform:scale(1);opacity:.8}to{transform:scale(1.35);opacity:0}}
@media (max-width:520px){.fab span{display:none}.fab{padding:0;width:58px;justify-content:center}}

/* Toast & modal */
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:200;display:grid;gap:10px;width:min(92vw,440px)}
.toast{padding:14px 18px;border-radius:14px;background:#0f2a20;border:1px solid var(--line-2);box-shadow:var(--shadow);display:flex;gap:10px;align-items:flex-start;animation:tin .25s ease-out}
.toast.error{border-color:rgba(255,129,151,.6)}.toast.error .ic{color:var(--rose)}
.toast.ok .ic{color:var(--mint)}
@keyframes tin{from{transform:translateY(10px);opacity:0}}
dialog{border:1px solid var(--line-2);border-radius:var(--r);background:#081b13;color:var(--text);padding:0;width:min(94vw,560px);max-height:90vh;box-shadow:0 40px 120px -20px #000}
dialog.wide{width:min(96vw,860px)}
dialog::backdrop{background:rgba(2,8,5,.7);backdrop-filter:blur(6px)}
.m-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#081b13;z-index:1}
.m-head h2{font-size:1.25rem;margin:0}
.m-body{padding:22px}
.lightbox{width:min(96vw,1100px);background:#000}
.lightbox .m-body{padding:0;display:grid;place-items:center}
.lightbox img,.lightbox video{max-height:76vh;width:auto;margin:auto}
.lb-cap{padding:12px 18px;color:var(--muted)}

/* Reveal */
.reveal{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

/* Loader */
.boot{min-height:60vh;display:grid;place-items:center}
.spinner{width:44px;height:44px;border-radius:50%;border:3px solid rgba(124,245,176,.15);border-top-color:var(--mint);animation:spin 1s linear infinite}
.skel{border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.04),rgba(255,255,255,.09),rgba(255,255,255,.04));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}

.bars{display:grid;gap:10px}

}

/* ================= Helpers ================= */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const parseISO = s => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const isISO = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));
const fmtDate = (s, o) => s ? parseISO(s).toLocaleDateString('en-GB', o || { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const fmtDay = s => fmtDate(s, { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
const fmtDT = s => s ? new Date(s).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : '';
const money = n => n == null || n === '' ? '' : 'P ' + Number(n).toLocaleString('en-GB', { maximumFractionDigits: 2 });
const nights = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const digits = p => { let d = String(p || '').replace(/\D/g, ''); if (d.length === 8) d = '267' + d; return d; };
const firstName = n => String(n || '').trim().split(/\s+/)[0] || '';
const MODE = { instant: 'Instant confirmation', request: 'Confirmed by our team', quote: 'Quotation' };
const STATUS = { pending: 'Pending', confirmed: 'Confirmed', rejected: 'Rejected', cancelled: 'Cancelled', completed: 'Completed' };
const SOURCE = { website: 'Website', phone: 'Phone', walk_in: 'Walk-in', whatsapp: 'WhatsApp', email: 'Email' };

const pill = (k, label) => html`<span class="pill ${k}">${label ?? k}</span>`;
const tf = x => x ? 'true' : 'false';
const debounce = (fn, ms = 200) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

async function loadPublic() {
  const t = todayISO();
  const q = await Promise.all([
    sb.from('settings').select('key,value'),
    sb.from('services').select('*').eq('active', true).order('sort'),
    sb.from('packages').select('*').eq('active', true).order('sort'),
    sb.from('promotions').select('*').eq('active', true).lte('start_date', t).gte('end_date', t).order('sort'),
    sb.from('testimonials').select('*').eq('published', true).order('sort'),
    sb.from('gallery').select('*').eq('published', true).order('sort').order('created_at', { ascending: false }),
    sb.from('menu_items').select('*').eq('available', true).order('section').order('sort'),
    sb.from('faqs').select('*').eq('published', true).order('sort')
  ]);
  const bad = q.find(r => r.error);
  if (bad) throw bad.error;
  S.settings = Object.fromEntries(q[0].data.map(r => [r.key, r.value]));
  [S.services, S.packages, S.promos, S.testimonials, S.gallery, S.menu, S.faqs] = q.slice(1).map(r => r.data);
  S.loaded = true;
}

function toast(msg, type = 'ok', ms = 4200) {
  const el = document.createElement('div');

  el.lastChild.textContent = msg;
  $('#toasts').append(el);
  setTimeout(() => el.remove(), ms);
}
const modal = $('#modal');
let confirmResolve = null;
function openModal(title, body, opt = {}) {
  modal.className = opt.cls || '';
  modal.innerHTML = String(html`<div class="m-head"><h2 id="m-title">${title}</h2><button class="icon-btn" data-act="modal-close" aria-label="Close dialog">${icon('close')}</button></div><div class="m-body">${body}</div>`);
  modal.setAttribute('aria-labelledby', 'm-title');
  if (!modal.open) modal.showModal();
  const f = modal.querySelector('.m-body input:not([type=hidden]):not(.hp input),.m-body select,.m-body textarea,.m-body button');
  if (f && !opt.noFocus) f.focus();
}
function closeModal() { if (modal.open) modal.close(); }
modal.addEventListener('close', () => { if (confirmResolve) { confirmResolve(false); confirmResolve = null; } modal.innerHTML = ''; });
modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });
function confirmDialog(msg, ok = 'Confirm', danger = false) {
  return new Promise(res => {
    openModal('Please confirm', html`<p>${msg}</p><div class="row end"><button class="btn ghost" data-act="cf-no">Cancel</button><button class="btn ${danger ? 'danger' : ''}" data-act="cf-yes">${ok}</button></div>`);

function download(name, text, type = 'text/csv;charset=utf-8') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([type.startsWith('text/csv') ? '﻿' + text : text], { type }));

    </div>

    <label class="check"><input type="checkbox" name="consent"> <span>Send me occasional news and offers (optional).</span></label>
    <p class="faint small">We'll use your details only to reply. See our <a href="#/privacy">privacy policy</a>.</p>
    <p class="err" data-err role="alert"></p>
    <button class="btn" type="submit">${icon('arrow')} Send message</button></form>`;
}
async function submitEnquiry(f) {
  const v = Object.fromEntries(new FormData(f));
  const err = $('[data-err]', f);
  err.textContent = '';
  if (v.website) { f.reset(); toast('Thank you — your message was sent.'); return; }
  if (!v.name.trim() || !v.message.trim()) { err.textContent = 'Please add your name and a message.'; return; }
  if (!v.phone.trim() && !v.email.trim()) { err.textContent = 'Please give us a phone number or email so we can reply.'; return; }
  const btn = $('button[type=submit]', f); btn.disabled = true;
  const { error } = await sb.rpc('submit_enquiry', { p_name: v.name, p_phone: v.phone, p_email: v.email, p_service_id: f.dataset.service || v.service || null, p_subject: v.subject || '', p_message: v.message, p_consent: !!v.consent });
  btn.disabled = false;
  if (error) { err.textContent = errText(error); return; }
  f.innerHTML = String(html`<div class="empty" style="border-style:solid">${icon('check')}<p><b>Thank you, ${firstName(v.name)}!</b><br>Your message has been received. We'll be in touch soon.</p><a class="btn sm wa" href="${waLink(`Hello Grand Bay, I just sent an enquiry on your website (${v.name}).`)}" target="_blank" rel="noopener noreferrer">${icon('whatsapp')} Need a faster reply?</a></div>`);
}

/* ================= Booking wizard ================= */
const B = { step: 1, sid: null, pid: null, date: null, end: null, time: '', guests: '', name: '', phone: '', email: '', notes: '', consent: false, agree: false, month: null, avail: {}, availKey: '', busy: false, result: null, errors: {} };
function resetBooking() { Object.assign(B, { step: 1, sid: null, pid: null, date: null, end: null, time: '', guests: '', notes: '', agree: false, month: null, avail: {}, availKey: '', busy: false, result: null, errors: {} }); }
const STEPS = ['Experience', 'Date & time', 'Your details', 'Review'];

function pageBook(q) {
  if (q.service) {
    const s = svcBySlug(q.service);
    if (s && (B.sid !== s.id || B.result)) { resetBooking(); B.sid = s.id; B.step = 2; }
    if (s && q.package && S.packages.some(p => p.id === q.package && p.service_id === s.id)) B.pid = q.package;
    if (s && isISO(q.date) && q.date >= todayISO()) { B.date = q.date; B.month = null; }
    if (q.guests && /^\d{1,4}$/.test(q.guests)) B.guests = q.guests;
    history.replaceState(null, '', '#/book');
  }
  if (B.result) return bookDone();
  return html`${pageHead(raw(String(icon('calendar')) + ' Bookings'), 'Make a booking', set('booking_note'), [[0, 'Book']])}
    <section style="padding-top:10px"><div class="wrap"><div class="book-grid">
      <div class="card pad"><ol class="steps" aria-label="Booking progress">${STEPS.map((l, i) => html`<li data-s="${i + 1 < B.step ? 'done' : i + 1 === B.step ? 'now' : 'todo'}" ${i + 1 === B.step ? raw('aria-current="step"') : ''}>${i + 1}. ${l}</li>`)}</ol>
        <div id="step">${stepHtml()}</div></div>
      <aside class="card pad summary" style="position:sticky;top:96px" id="bsum">${bookSummary()}</aside>
    </div></div></section>`;
}
function bookSummary() {
  const s = svcById(B.sid), p = S.packages.find(x => x.id === B.pid);
  return html`<span class="kicker">Your booking</span>
    ${s ? html`<h3>${s.name}</h3><dl>
      ${p ? html`<dt>Package</dt><dd>${p.name}</dd>` : ''}
      <dt>${s.stay_mode ? 'Check-in' : 'Date'}</dt><dd>${B.date ? fmtDay(B.date) : '—'}</dd>
      ${s.stay_mode ? html`<dt>Check-out</dt><dd>${B.end ? fmtDay(B.end) : '—'}</dd>${B.date && B.end ? html`<dt>Nights</dt><dd>${nights(B.date, B.end)}</dd>` : ''}` : ''}
      ${s.time_slots ? html`<dt>Time</dt><dd>${B.time || '—'}</dd>` : ''}

      <dt>Confirmation</dt><dd>${pill(s.booking_mode, MODE[s.booking_mode])}</dd></dl>` : html`<p class="muted">Choose an experience to begin.</p>`}
    <p class="faint small" style="margin:0">${icon('lock')} No payment is taken online. Prefer to talk? <a href="${waLink(s ? s.whatsapp_message : '')}" target="_blank" rel="noopener noreferrer">Chat on WhatsApp</a>.</p>`;
}
function navBtns(nextLabel = 'Continue') {
  return html`<div class="row between" style="margin-top:24px">${B.step > 1 ? html`<button class="btn ghost" data-act="b-back">${icon('back')} Back</button>` : html`<span></span>`}

const fErr = k => B.errors[k] ? html`<span class="err" id="err-${k}">${B.errors[k]}</span>` : '';
function stepHtml() {

    const pk = s ? S.packages.filter(p => p.service_id === s.id) : [];
    return html`<h2>What would you like to book?</h2>
      <div class="opt-grid" role="radiogroup" aria-label="Experience">${S.services.map(x => html`<button class="opt" role="radio" aria-checked="${tf(x.id === B.sid)}" data-act="b-svc" data-id="${x.id}"><span class="oi">${icon(x.icon)}</span><span><b>${x.name}</b><small>${priceText(x)}</small></span></button>`)}</div>
      ${fErr('sid')}
      ${pk.length ? html`<h3 style="margin-top:26px">Choose a package <span class="muted small">(optional)</span></h3><div class="opt-grid" role="radiogroup" aria-label="Package">
        <button class="opt" role="radio" aria-checked="${tf(!B.pid)}" data-act="b-pkg" data-id=""><span><b>Not sure yet</b><small>We'll help you choose</small></span></button>
        ${pk.map(p => html`<button class="opt" role="radio" aria-checked="${tf(p.id === B.pid)}" data-act="b-pkg" data-id="${p.id}"><span><b>${p.name}</b><small>${p.price != null ? money(p.price) : (p.price_note || 'On request')}</small></span></button>`)}</div>` : ''}
      ${navBtns()}`;

function calHtml() {
  const s = svcById(B.sid);
  const t = todayISO(), max = addDays(t, 730);
  if (!B.month) { const d = parseISO(B.date || t); B.month = new Date(d.getFullYear(), d.getMonth(), 1); }
  const y = B.month.getFullYear(), m = B.month.getMonth();
  const offset = (new Date(y, m, 1).getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  const canPrev = new Date(y, m, 1) > new Date(parseISO(t).getFullYear(), parseISO(t).getMonth(), 1);
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push(html`<span></span>`);
  for (let d = 1; d <= days; d++) {
    const ds = `${y}-${pad(m + 1)}-${pad(d)}`, st = B.avail[ds] || 'open';
    const past = ds < t || ds > max;
    const dis = past || st === 'full' || st === 'blocked';
    const sel = ds === B.date || ds === B.end, rng = s.stay_mode && B.date && B.end && ds > B.date && ds < B.end;
    const lbl = `${fmtDay(ds)}${st === 'full' ? ', fully booked' : st === 'blocked' ? ', unavailable' : st === 'limited' ? ', limited availability' : ''}${sel ? ', selected' : ''}`;
    cells.push(html`<button class="day ${st} ${ds === t ? 'today' : ''} ${sel ? 'sel' : ''} ${rng ? 'range' : ''}" data-act="b-day" data-d="${ds}" aria-label="${lbl}" aria-pressed="${tf(sel)}" ${dis ? 'disabled' : ''}>${d}</button>`);
  }
  return html`<div class="cal"><div class="cal-head"><button class="icon-btn" data-act="b-month" data-dir="-1" aria-label="Previous month" ${canPrev ? '' : 'disabled'}>${icon('back')}</button>
    <b aria-live="polite">${B.month.toLocaleDateString('en-GB', { month: 'long', year: 'numeric' })}</b><button class="icon-btn" data-act="b-month" data-dir="1" aria-label="Next month">${icon('arrow')}</button></div>
    <div class="cal-grid">${['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(d => html`<span class="cal-dow" aria-hidden="true">${d}</span>`)}${cells}</div>
    <div class="legend"><span><i style="background:var(--mint)"></i>Selected</span><span><i style="background:var(--amber)"></i>Limited</span><span><i style="background:var(--rose)"></i>Fully booked</span></div></div>`;
}
async function loadAvail() {
  if (!B.sid || !B.month) return;
  const y = B.month.getFullYear(), m = B.month.getMonth();
  const from = iso(new Date(y, m, 1)), to = iso(new Date(y, m + 1, 0));
  const key = B.sid + from;
  if (B.availKey === key) return;
  B.availKey = key;
  const { data, error } = await sb.rpc('get_availability', { p_service_id: B.sid, p_from: from, p_to: to });
  if (error || B.availKey !== key) return;
  data.forEach(r => { B.avail[r.day] = r.state; });
  const c = $('#cal'); if (c) c.innerHTML = String(calHtml());
  if (B.date && ['full', 'blocked'].includes(B.avail[B.date])) { B.date = null; B.end = null; redrawStep(); toast('Your chosen date is no longer available — please pick another.', 'error'); }
}
function redrawStep(focusErr) {
  const st = $('#step'); if (!st) return;
  st.innerHTML = String(stepHtml());
  $('#bsum').innerHTML = String(bookSummary());
  $$('.steps li').forEach((li, i) => { li.dataset.s = i + 1 < B.step ? 'done' : i + 1 === B.step ? 'now' : 'todo'; i + 1 === B.step ? li.setAttribute('aria-current', 'step') : li.removeAttribute('aria-current'); });
  if (B.step === 2) loadAvail();
  if (focusErr) { const e = $('[aria-invalid=true]', st) || $('.err', st); (e && e.focus ? e : st).focus?.(); }
}
function validateStep() {
  const s = svcById(B.sid), e = {};
  if (B.step === 1 && !s) e.sid = 'Please choose an experience.';
  if (B.step === 2) {
    if (!B.date) e.date = s.stay_mode ? 'Please choose your check-in date.' : 'Please choose a date.';
    else if (s.stay_mode && !B.end) e.date = 'Please choose your check-out date.';
    if (s.time_slots && !B.time) e.time = 'Please choose a time.';
  }
  if (B.step === 3) {
    if (B.name.trim().length < 2) e.name = 'Please enter your full name.';
    if (!/^\+?[0-9 ()-]{7,20}$/.test(B.phone.trim())) e.phone = 'Enter a valid phone number, e.g. +267 71 234 567.';
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(B.email.trim())) e.email = 'Enter a valid email address.';
    const g = Number(B.guests);
    if (!Number.isInteger(g) || g < 1 || g > s.max_guests) e.guests = `Enter between 1 and ${s.max_guests} guests.`;
    if (!B.agree) e.agree = 'Please accept the booking terms to continue.';
  }
  B.errors = e;
  return !Object.keys(e).length;
}
async function submitBooking() {
  const s = svcById(B.sid);
  B.busy = true; B.errors = {}; redrawStep();
  const { data, error } = await sb.rpc('create_booking', {
    p_service_id: B.sid, p_package_id: B.pid || null, p_name: B.name, p_phone: B.phone, p_email: B.email,
    p_guests: Number(B.guests), p_date: B.date, p_end_date: s.stay_mode ? B.end : null, p_time: B.time || null, p_notes: B.notes, p_consent: !!B.consent
  });
  B.busy = false;
  if (error) { B.errors = { submit: errText(error) }; B.availKey = ''; redrawStep(); $('#b-err')?.focus(); return; }
  B.result = { ...data, date: B.date, end: B.end, time: B.time, guests: B.guests, email: B.email, name: B.name };
  store.set('gb_last_ref', data.reference);
  render();
}

function downloadICS() {
  const r = B.result; if (!r) return;
  const e = s => String(s).replace(/[\\;,]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const d = r.date.replace(/-/g, '');
  let start, end;
  if (r.time) { start = `DTSTART:${d}T${r.time.replace(':', '')}00`; end = `DTEND:${d}T${pad(Math.min(23, Number(r.time.slice(0, 2)) + 2))}${r.time.slice(3)}00`; }
  else { start = `DTSTART;VALUE=DATE:${d}`; end = `DTEND;VALUE=DATE:${(r.end || addDays(r.date, 1)).replace(/-/g, '')}`; }
  const ics = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Grand Bay//Booking//EN', 'BEGIN:VEVENT', `UID:${r.reference}@grandbay`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`, start, end,
    `SUMMARY:${e(r.service + ' – ' + set('short_name'))}`, `LOCATION:${e(set('address'))}`, `DESCRIPTION:${e('Booking reference ' + r.reference + ' (' + STATUS[r.status] + ')')}`, 'END:VEVENT', 'END:VCALENDAR'].join('\r\n');
  download(`grand-bay-${r.reference}.ics`, ics, 'text/calendar');
}

function fieldHtml(f, v) {
  const id = 'f_' + f.k;
  let val = v ?? (typeof f.def === 'function' ? f.def() : f.def) ?? '';
  const t = f.t || 'text';
  const help = f.help ? html`<small class="help">${f.help}</small>` : '';
  const wrapCls = 'field' + (f.full ? ' full' : '');
  if (t === 'bool') return html`<div class="${wrapCls}" style="justify-content:flex-end"><label class="switch"><input type="checkbox" name="${f.k}" ${val === true ? 'checked' : ''}><span class="sw" aria-hidden="true"></span><span>${f.l}</span></label>${help}</div>`;
  let ctl;
  const req = f.req ? 'required' : '';
  if (t === 'textarea') ctl = html`<textarea id="${id}" name="${f.k}" rows="${f.rows || 4}" maxlength="${f.max || 8000}" ${req}>${val}</textarea>`;
  else if (t === 'select') { const o = typeof f.opts === 'function' ? f.opts() : f.opts; ctl = html`<select id="${id}" name="${f.k}" ${req}>${o.map(x => html`<option value="${x.v}" ${String(x.v) === String(val ?? '') ? 'selected' : ''}>${x.l}</option>`)}</select>`; }
  else if (t === 'number' || t === 'money') ctl = html`<input id="${id}" name="${f.k}" type="number" inputmode="decimal" step="${t === 'money' ? '0.01' : '1'}" min="${f.min ?? 0}" value="${val}" ${req}>`;
  else if (t === 'image') { const u = safeUrl(val); ctl = html`<div class="img-field"><input id="${id}" name="${f.k}" type="url" placeholder="https://… or upload" value="${val}" ${req}><label class="btn sm ghost upl">${icon('upload')} Upload<input type="file" class="sr" accept="image/jpeg,image/png,image/webp,image/gif${f.video ? ',video/mp4,video/webm' : ''}" data-upload="${f.k}"></label></div>${u ? html`<img class="thumb" src="${u}" alt="Current image">` : ''}`; }
  else ctl = html`<input id="${id}" name="${f.k}" type="${['date', 'time', 'email', 'url'].includes(t) ? t : 'text'}" value="${val}" maxlength="${f.max || 300}" ${f.pattern ? raw(`pattern="${esc(f.pattern)}"`) : ''} ${f.list ? raw(`list="dl_${f.k}"`) : ''} ${req}>${f.list ? html`<datalist id="dl_${f.k}">${f.list.map(x => html`<option value="${x}">`)}</datalist>` : ''}`;
  return html`<div class="${wrapCls}"><label for="${id}">${f.l}${f.req ? html`<span class="req" aria-hidden="true">*</span>` : ''}</label>${ctl}${help}</div>`;
}
function collect(fields, form) {
  const o = {};
  for (const f of fields) {
    const el = form.elements[f.k]; if (!el) continue;
    const t = f.t || 'text';
    if (t === 'bool') o[f.k] = el.checked;
    else if (t === 'number') o[f.k] = el.value === '' ? (f.def ?? 0) : parseInt(el.value, 10);
    else if (t === 'money') o[f.k] = el.value === '' ? null : Number(el.value);
    else if (t === 'select') o[f.k] = el.value === '' ? null : (f.k === 'rating' ? Number(el.value) : el.value);
    else if (t === 'date' || t === 'time') o[f.k] = el.value || null;
    else o[f.k] = el.value.trim();
  }
  return o;
}
const ALLOWED = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/gif': 'gif', 'video/mp4': 'mp4', 'video/webm': 'webm' };
async function uploadFile(file, folder = 'uploads') {
  if (!ALLOWED[file.type]) throw new Error('Unsupported file type. Use JPG, PNG, WebP, GIF, MP4 or WebM.');
  if (file.size > 10 * 1024 * 1024) throw new Error('File is larger than 10 MB. Please resize it first.');
  const path = `${folder}/${Date.now()}-${crypto.getRandomValues(new Uint32Array(2)).join('')}.${ALLOWED[file.type]}`;
  const { error } = await sb.storage.from(BUCKET).upload(path, file, { contentType: file.type, cacheControl: '31536000', upsert: false });
  if (error) throw error;
  return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;
}

async function availabilityWarning(o, prev) {
  if (!['pending', 'confirmed'].includes(o.status)) return true;
  if (prev && prev.booking_date === o.booking_date && prev.service_id === o.service_id && (prev.end_date || null) === (o.end_date || null) && ['pending', 'confirmed'].includes(prev.status)) return true;
  const { data } = await sb.rpc('get_availability', { p_service_id: o.service_id, p_from: o.booking_date, p_to: o.end_date ? addDays(o.end_date, -1) : o.booking_date });
  const bad = (data || []).filter(d => d.state === 'full' || d.state === 'blocked');
  if (!bad.length) return true;
  return confirmDialog(`Heads up: ${bad.map(d => fmtDate(d.day) + ' is ' + (d.state === 'full' ? 'already fully booked' : 'blocked')).join(', ')} for this service. Save anyway (this may double-book)?`, 'Save anyway', true);
}
async function setBookingStatus(id, status) {
  let b = A.bookings.find(x => x.id === id);
  if (!b) { const r = await sb.from('bookings').select('*, services(name)').eq('id', id).single(); b = r.data; }
  if (!b) return;
  if (status === 'confirmed' && !(await availabilityWarning({ ...b, status }, { ...b, status: 'confirmed' }))) return;
  if (['rejected', 'cancelled'].includes(status) && !(await confirmDialog(`Mark booking ${b.reference} as ${STATUS[status].toLowerCase()}?`, STATUS[status], true))) return;
  const { error } = await sb.from('bookings').update({ status }).eq('id', id);
  if (error) return toast(errText(error), 'error');
  b.status = status;
  toast(`Booking ${b.reference} ${STATUS[status].toLowerCase()}.`);
  notifyModal(b, status);
  const sec = location.hash.split('/')[2] || 'dashboard';
  if (sec === 'bookings') redrawBookings(); else ADM[sec]?.();
}

async function applyRequest(id) {
  const r = A.rows.requests.find(x => x.id === id); if (!r) return;
  const b = r.bookings;
  let patch;
  if (r.kind === 'cancel') { if (!(await confirmDialog(`Cancel booking ${b.reference} for ${b.customer_name}?`, 'Cancel booking', true))) return; patch = { status: 'cancelled' }; }
  else {
    const nb = { ...b, booking_date: r.preferred_date, end_date: b.end_date ? addDays(r.preferred_date, nights(b.booking_date, b.end_date)) : null };
    if (!(await availabilityWarning(nb, null))) return;
    patch = { booking_date: nb.booking_date, end_date: nb.end_date };
  }
  const { error } = await sb.from('bookings').update(patch).eq('id', b.id);
  if (error) return toast(errText(error), 'error');
  await sb.from('booking_requests').update({ status: 'done' }).eq('id', id);
  toast('Booking updated.');
  const nb = { ...b, ...patch };
  if (r.kind === 'cancel') notifyModal(nb, 'cancelled');
  else { const msg = `Hello ${firstName(b.customer_name)}, your booking ${b.reference} for ${b.services?.name} has been moved to ${fmtDay(nb.booking_date)}. – ${set('business_name')}`; openModal('Notify the customer', html`<textarea readonly rows="3" style="margin-bottom:14px">${msg}</textarea><div class="row end">${digits(b.phone) ? html`<a class="btn wa" href="https://wa.me/${digits(b.phone)}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener noreferrer">${icon('whatsapp')} WhatsApp</a>` : ''}<button class="btn ghost" data-act="modal-close">Done</button></div>`); }

}

  const per = Object.entries(by(data, pkey)).sort(([a], [z]) => a < z ? -1 : 1).map(([k, v]) => ({ k, n: v.length, p: v.filter(b => b.status === 'pending').length, c: v.filter(b => b.status === 'confirmed' || b.status === 'completed').length, x: v.filter(b => b.status === 'cancelled' || b.status === 'rejected').length, g: v.reduce((a, b) => a + b.guests, 0) }));

      <div class="card pad"><h2 style="font-size:1.15rem">Booking channels</h2><div class="bars">${src.length ? src.map(s => html`<div class="bar"><span>${s.k}</span><span class="track"><span class="fill" style="width:${Math.round(s.n / Math.max(1, data.length) * 100)}%;display:block"></span></span><b>${s.n}</b></div>`) : html`<p class="muted">No data.</p>`}</div></div></div>
    <div class="card pad" style="margin-top:18px"><div class="row between"><h2 style="font-size:1.15rem;margin:0">Bookings by ${r.group}</h2><div class="row"><button class="btn xs ghost" data-act="rep-csv" data-k="per">${icon('download')} Summary CSV</button><button class="btn xs ghost" data-act="rep-csv" data-k="all">${icon('download')} All bookings CSV</button></div></div>

function repPreset(p) {
  const t = todayISO(), d = new Date();
  const r = A.rep;
  if (p === 'today') { r.from = t; r.to = t; r.group = 'day'; }
  if (p === 'week') { const m = new Date(d); m.setDate(d.getDate() - (d.getDay() + 6) % 7); r.from = iso(m); r.to = addDays(r.from, 6); r.group = 'day'; }
  if (p === 'month') { r.from = iso(new Date(d.getFullYear(), d.getMonth(), 1)); r.to = iso(new Date(d.getFullYear(), d.getMonth() + 1, 0)); r.group = 'day'; }
  if (p === '30') { r.from = addDays(t, -29); r.to = t; r.group = 'day'; }
  if (p === 'year') { r.from = `${d.getFullYear()}-01-01`; r.to = `${d.getFullYear()}-12-31`; r.group = 'month'; }
  if (p === 'next30') { r.from = t; r.to = addDays(t, 30); r.basis = 'booking_date'; r.group = 'day'; }
  ADM.reports();
}

function crudRows(key, q = '') {
  const E = ENT[key], rows = A.rows[key] || [], ql = q.toLowerCase();
  const list = rows.filter(r => !ql || E.search.some(f => String(r[f] || '').toLowerCase().includes(ql)));

    const v = Object.fromEntries(new FormData(f)), err = $('[data-err]', f);
    if (!v.ref.trim() || !v.email.trim()) { err.textContent = 'Please enter your reference and email.'; return; }

    const { data, error } = await sb.rpc('lookup_booking', { p_reference: v.ref, p_email: v.email });

  },
  'mb-change': async f => {

    const btn = $('button[type=submit]', f); btn.disabled = true; btn.textContent = 'Signing in…';
    const { error } = await sb.auth.signInWithPassword({ email: v.email.trim(), password: v.password });
    btn.disabled = false; btn.innerHTML = String(html`${icon('lock')} Sign in`);
    if (error) { A.loginFails++; if (A.loginFails >= 5) { A.lockUntil = Date.now() + 60000; A.loginFails = 0; } err.textContent = 'Incorrect email or password.'; return; }
    A.loginFails = 0; A.lastActive = Date.now(); render();

    const { error } = id ? await sb.from(E.table).update(o).eq('id', id) : await sb.from(E.table).insert(o);
    btn.disabled = false;
    if (error) { err.textContent = error.code === '23505' ? 'That web address (slug) is already used.' : errText(error); return; }
    closeModal(); toast('Saved.'); await afterContentChange(k);
  },
  settings: async f => {
    const err = $('[data-err]', f), changed = A.rows.settings.filter(s => f.elements[s.key] && f.elements[s.key].value !== s.value);
    if (!changed.length) { toast('No changes to save.'); return; }
    for (const s of changed) { const val = f.elements[s.key].value; if (s.kind === 'url' || s.kind === 'image') { if (val && !safeUrl(val)) { err.textContent = `${s.label}: links must start with https://`; return; } } }
    const btn = $('button[type=submit]', f); btn.disabled = true;
    const res = await Promise.all(changed.map(s => sb.from('settings').update({ value: f.elements[s.key].value.trim() }).eq('key', s.key)));
    btn.disabled = false;
    const bad = res.find(r => r.error);
    if (bad) { err.textContent = errText(bad.error); return; }
    toast(`Saved ${changed.length} change(s). The website is updated.`);
    await loadPublic().catch(() => {}); ADM.settings();
  },
  'staff-add': async f => {
    const v = Object.fromEntries(new FormData(f)), err = $('[data-err]', f);
    const { error } = await sb.rpc('add_staff_by_email', { p_email: v.email, p_role: v.role, p_name: v.name });
    if (error) { err.textContent = errText(error); return; }
    toast('Access granted.'); ADM.staff();
  }
};
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form]?.(f, e); });

const redrawCustDeb = debounce(q => { const b = $('#cs-body'); if (b) b.innerHTML = String(custRows(q)); }, 150);
const redrawCrudDeb = debounce((k, q) => { const b = $('#crud-body'); if (b) b.innerHTML = String(crudRows(k, q)); }, 150);
const redrawBkDeb = debounce(redrawBookings, 150);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.b) { B[t.dataset.b] = t.type === 'checkbox' ? t.checked : t.value; if (B.errors[t.dataset.b]) { delete B.errors[t.dataset.b]; t.removeAttribute('aria-invalid'); $('#err-' + t.dataset.b)?.remove(); } if (['guests'].includes(t.dataset.b)) $('#bsum').innerHTML = String(bookSummary()); }
  if (t.dataset.bf) { A.bf[t.dataset.bf] = t.value; redrawBkDeb(); }
  if (t.hasAttribute('data-cust-q')) redrawCustDeb(t.value);
  if (t.dataset.crudQ) redrawCrudDeb(t.dataset.crudQ, t.value);
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.b && t.type === 'checkbox') { B[t.dataset.b] = t.checked; if (t.dataset.b === 'agree' && t.checked) { delete B.errors.agree; $('#err-agree')?.remove(); } }
  if (t.dataset.upload) {
    const file = t.files[0]; if (!file) return;
    const wrap = t.closest('.field'), inp = $('input[type=url]', wrap), lbl = t.closest('label');
    lbl.classList.add('busy'); lbl.setAttribute('aria-busy', 'true');
    try { inp.value = await uploadFile(file, t.dataset.upload === 'image_url' ? 'content' : 'site'); let th = $('.thumb', wrap); if (!th) { th = document.createElement('img'); th.className = 'thumb'; th.alt = 'Uploaded image'; wrap.append(th); } if (file.type.startsWith('image/')) th.src = inp.value; const mt = t.form?.elements.media_type; if (mt) mt.value = file.type.startsWith('video/') ? 'video' : 'image'; toast('Uploaded.'); }
    catch (er) { toast(errText(er), 'error'); }
    lbl.classList.remove('busy'); lbl.removeAttribute('aria-busy'); t.value = '';
  }
  if (t.dataset.bulk) {
    const files = [...t.files]; if (!files.length) return;
    toast(`Uploading ${files.length} file(s)…`);
    let ok = 0;
    for (const file of files) { try { const url = await uploadFile(file, 'gallery'); const { error } = await sb.from('gallery').insert({ image_url: url, caption: '', category: 'Gardens', media_type: file.type.startsWith('video/') ? 'video' : 'image' }); if (error) throw error; ok++; } catch (er) { toast(`${file.name}: ${errText(er)}`, 'error'); } }
    t.value = ''; toast(`${ok} file(s) added. Edit them to set captions and categories.`); afterContentChange('gallery');
  }
  if (t.dataset.change === 'crud-toggle') {
    const E = ENT[t.dataset.key];
    const { error } = await sb.from(E.table).update({ [E.toggle]: t.checked }).eq('id', t.dataset.id);
    if (error) { t.checked = !t.checked; return toast(errText(error), 'error'); }
    const r = A.rows[t.dataset.key].find(x => x.id === t.dataset.id); if (r) r[E.toggle] = t.checked;
    toast(t.checked ? 'Now visible on the website.' : 'Hidden from the website.');
    if (['services', 'packages'].includes(t.dataset.key)) loadAdminCatalogue();
    loadPublic().catch(() => {});
  }
  if (t.dataset.change === 'enq-status') { const { error } = await sb.from('enquiries').update({ status: t.value }).eq('id', t.dataset.id); if (error) return toast(errText(error), 'error'); toast('Status updated.'); refreshCounts(); }
  if (t.dataset.change === 'staff-role') { const { error } = await sb.from('staff').update({ role: t.value }).eq('user_id', t.dataset.id); if (error) return toast(errText(error), 'error'); toast('Role updated.'); }
  if (t.dataset.change === 'staff-active') { const { error } = await sb.from('staff').update({ active: t.checked }).eq('user_id', t.dataset.id); if (error) { t.checked = !t.checked; return toast(errText(error), 'error'); } toast(t.checked ? 'Access enabled.' : 'Access disabled.'); }
});

/* Inactivity sign-out for staff */
['pointerdown', 'keydown', 'scroll'].forEach(ev => document.addEventListener(ev, () => { A.lastActive = Date.now(); }, { passive: true }));
setInterval(async () => { if (A.staff && Date.now() - A.lastActive > IDLE_LIMIT_MS) { await sb.auth.signOut(); A.staff = null; toast('Signed out after 30 minutes of inactivity.'); if (location.hash.startsWith('#/admin')) render(); } }, 60000);

sb.auth.onAuthStateChange((event) => {
  if (event === 'PASSWORD_RECOVERY') {
    setTimeout(() => openModal('Choose a new password', html`<form data-form="new-pass" novalidate><div class="field"><label for="np1">New password</label><input id="np1" name="p1" type="password" autocomplete="new-password" minlength="10" required></div><div class="field"><label for="np2">Confirm password</label><input id="np2" name="p2" type="password" autocomplete="new-password" minlength="10" required></div><p class="err" data-err role="alert"></p><button class="btn" type="submit">Save password</button></form>`), 300);
  }
  if (event === 'SIGNED_OUT') A.staff = null;
});

/* ================= Router ================= */
const io = 'IntersectionObserver' in window ? new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } }), { rootMargin: '0px 0px -8% 0px' }) : null;
const TITLES = { '': '', about: 'About us', services: 'Services', packages: 'Packages & pricing', book: 'Book online', manage: 'Manage booking', gallery: 'Gallery', restaurant: 'Restaurant', contact: 'Contact', privacy: 'Privacy policy', terms: 'Terms' };
function parseHash() {
  const h = location.hash;
  if (h && !h.startsWith('#/')) return null;
  const [p, qs] = (h.slice(2) || '').split('?');
  return { path: p.split('/').filter(Boolean).map(decodeURIComponent), q: Object.fromEntries(new URLSearchParams(qs || '')) };
}
function render() {
  const r = parseHash(); if (!r) return;
  const { path, q } = r;
  if (modal.open && !path[0]?.startsWith('admin')) closeModal();
  if (path[0] === 'admin') { renderAdmin(path[1]); return; }
  renderToken++;
  document.body.classList.remove('is-admin');
  renderChrome(path);
  const pg = path[0] || '';
  if (pg !== 'book' && B.result) resetBooking();
  let view;
  switch (pg) {
    case '': view = pageHome(); break;
    case 'about': view = pageAbout(); break;
    case 'services': view = path[1] ? pageService(path[1]) : pageServices(q); break;
    case 'packages': view = pagePackages(); break;
    case 'book': view = pageBook(q); break;
    case 'manage': view = pageManage(); break;
    case 'gallery': view = pageGallery(q); break;
    case 'restaurant': view = pageRestaurant(); break;
    case 'contact': view = pageContact(); break;
    case 'privacy': case 'terms': view = pageLegal(pg); break;
    default: view = page404();
  }
  const main = $('#main');
  main.innerHTML = String(view);
  const svc = pg === 'services' && path[1] ? svcBySlug(path[1]) : pg === 'book' ? svcById(B.sid) : null;
  setFab(svc ? svc.whatsapp_message : set('whatsapp_default'));
  const name = set('business_name', 'Grand Bay Botanical Gardens');
  document.title = (svc && pg === 'services' ? svc.name : TITLES[pg] || '') ? `${svc && pg === 'services' ? svc.name : TITLES[pg]} · ${name}` : `${name} · ${set('tagline')}`;
  const md = document.querySelector('meta[name=description]'); if (md && svc && pg === 'services') md.content = `${svc.name} at ${name}: ${svc.tagline}`;
  $$('.reveal', main).forEach(el => io ? io.observe(el) : el.classList.add('in'));
  if (pg === 'book' && B.step === 2) loadAvail();
  window.scrollTo({ top: 0, behavior: 'instant' });
  const h1 = $('h1', main); if (h1 && document.activeElement !== document.body) h1.focus({ preventScroll: true });
}
window.addEventListener('hashchange', render);

(async function init() {
  try {
    await loadPublic();
  } catch (e) {
    $('#main').innerHTML = String(html`<div class="wrap" style="padding:80px 16px"><div class="empty">${icon('ban')}<p><b>We couldn't load the website right now.</b><br>Please check your connection and try again.</p><button class="btn sm" data-act="reload">Retry</button></div></div>`);
    ACT.reload = () => location.reload();
    return;
  }
  if (location.search.includes('code=')) { await sb.auth.getSession(); history.replaceState(null, '', location.pathname + (location.hash || '#/admin')); }
  render();
})();
})();
</script>
</body>
